name: Performance Baseline

# 只记录、不拦截：手动触发或每周一次。结果作为 artifact 保存，不影响 CI / 部署。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bundle size baseline
        run: node scripts/report-bundle-size.js --out bundle-size.json

      - name: Lighthouse CI (warn only)
        run: npx --yes @lhci/cli@0.14.x autorun
        continue-on-error: true

      - name: Lighthouse mobile representative pages (warn only)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.mobile.json
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          include-hidden-files: true
          path: |
            bundle-size.json
            .lighthouseci
