<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-label="三种边界问题"><title>三种边界问题</title><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#253c37}.minor{fill:#62726b}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="28" y="44" font-size="27" class="">三个问题，需要分别回答</text><text x="28" y="78" font-size="16" class="minor">这是本站比较框架，不是由弱到强的证据等级。</text><a href="conclusions/b2.md"><rect x="28" y="116" width="320" height="178" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="46" y="150" font-size="21" class="">当下的因果贡献</text><text x="46" y="190" font-size="16" class="">移除或扰动，改变了什么？</text><text x="46" y="222" font-size="16" class="">任务、信息、反馈与代价对齐</text><text x="46" y="254" font-size="16" class="">支持依赖关系；仍需构成判据</text></a><a href="conclusions/b3.md"><rect x="372" y="116" width="320" height="178" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="390" y="150" font-size="21" class="">发展与学习依赖</text><text x="390" y="190" font-size="16" class="">过去怎样改变当前状态？</text><text x="390" y="222" font-size="16" class="">历史 × 测试支持；保持与迁移</text><text x="390" y="254" font-size="16" class="">短时效应不独自识别长期机制</text></a><a href="conclusions/b4.md"><rect x="716" y="116" width="320" height="178" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="734" y="150" font-size="21" class="">认知或生命的构成</text><text x="734" y="190" font-size="16" class="">采用何种组织与归属判据？</text><text x="734" y="222" font-size="16" class="">功能整合／内容／生产网络</text><text x="734" y="254" font-size="16" class="">判据有争议；不以有用代替</text></a><text x="28" y="346" font-size="17" class="">共同要求：说明分析单位、时间窗口、介入位置、最强异议及下一项区分检验。</text></svg>
