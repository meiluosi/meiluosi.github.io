<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1170" viewBox="0 0 1080 1170" role="img" aria-label="系统边界问题的阅读节点"><title>系统边界问题的阅读节点</title><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#253c37}.minor{fill:#62726b}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="28" y="44" font-size="27" class="">问题怎样演进？</text><text x="28" y="78" font-size="16" class="minor">按书目年排列；节点间距不代表年数，时间先后不代表影响。</text><text x="28" y="140" font-size="23" class="">1974</text><a href="notes/varela-1974.md"><rect x="130" y="106" width="920" height="94" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="150" y="136" font-size="21" class="">生产组织如何形成统一体？</text><text x="150" y="166" font-size="16" class="">生产网络与六步判定；保留成分参与例外</text><text x="750" y="188" font-size="13" class="minor">Francisco J. Varela 等</text></a><text x="28" y="250" font-size="23" class="">1995</text><a href="notes/hutchins-cockpit-1995.md"><rect x="130" y="216" width="920" height="94" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="150" y="246" font-size="21" class="">驾驶舱如何记住速度？</text><text x="150" y="276" font-size="16" class="">跨人员、物与时间追踪表征转换</text><text x="750" y="298" font-size="13" class="minor">Edwin Hutchins</text></a><text x="28" y="360" font-size="23" class="">1998</text><a href="notes/clark-chalmers-1998.md"><rect x="130" y="326" width="920" height="94" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="150" y="356" font-size="21" class="">认知过程能否延伸到外部？</text><text x="150" y="386" font-size="16" class="">角色等价与稳定整合的边界提案</text><text x="750" y="408" font-size="13" class="minor">Andy Clark 等</text></a><text x="28" y="470" font-size="23" class="">1999</text><a href="notes/smith-thelen-1999.md"><rect x="130" y="436" width="920" height="94" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="150" y="466" font-size="21" class="">动作历史怎样改变作答？</text><text x="150" y="496" font-size="16" class="">预训练与姿势实验；长期解释仍待检验</text><text x="750" y="518" font-size="13" class="minor">Linda B