<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">跨篇复核地图</title><desc id="desc">六组问题及其新增前提，底部为跨篇版本与失败审计；连线不表示已证明的递进。</desc><rect width="1000" height="490" fill="#f6f5ed"/><g font-family="sans-serif" fill="#253f38"><text x="40" y="35" font-size="20">每跨一步，都要补充前提</text><rect x="40" y="65" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="62" y="109" font-size="23">表现与能力</text><text x="62" y="145" font-size="17">p1 · p4</text><rect x="360" y="65" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="382" y="109" font-size="23">机制识别</text><text x="382" y="145" font-size="17">p2 · p3 · p6</text><rect x="680" y="65" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="702" y="109" font-size="23">系统边界</text><text x="702" y="145" font-size="17">b1 · b2 · b6</text><rect x="40" y="250" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="62" y="294" font-size="23">发展与组织</text><text x="62" y="330" font-size="17">b3 · b4 · b5</text><rect x="360" y="250" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="382" y="294" font-size="23">意义与归属</text><text x="382" y="330" font-size="17">m1 · m2</text><rect x="680" y="250" width="280" height="115" rx="14" fill="#e3e9df" stroke="#778b7b"/><text x="702" y="294" font-size="23">访问与体验</text><text x="702" y="330" font-size="17">m3 · m4</text><path d="M320 120H360 M640 120H680 M820 180V215H180V250 M820 215H500V250 M820 215V250" fill="none" stroke="#8e745b" stroke-width="2"/><text x="40" y="220" font-size="15">任务与单位 → 干预与过程 → 构成、组织及桥接判据</text><rect x="40" y="397" width="920" height="53" rx="12" fill="#e8dfd1"/><text x="62" y="430" font-size="19">共同审计：p5 · m5 · m6 — 来源版本、测量条件、旧失败与新预测</text><text x="40" y="477" font-size="14">连线表示需要追问的关系，不表示已证明的理论阶梯或历史影响。</text></g></svg>
