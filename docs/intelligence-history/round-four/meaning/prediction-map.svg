<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 930" role="img" aria-label="COGITATE六项预测的分析身份与结果"><title>COGITATE六项预测的分析身份与结果</title><rect width="1100" height="930" fill="#f4f3e9"/><g font-family="system-ui, -apple-system, PingFang SC, sans-serif"><text x="35" y="48" font-size="27" fill="#243b35"><tspan x="35" dy="0">同一实验，逐项判读</tspan></text><text x="35" y="82" font-size="16" fill="#5c6a61"><tspan x="35" dy="0">预注册与探索性证据分别记；这些结果不是意识理论的总排名。</tspan></text><rect x="30" y="116" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="150" font-size="22" fill="#243b35"><tspan x="52" dy="0">IIT · 内容位置</tspan></text><text x="52" y="183" font-size="14" fill="#725637"><tspan x="52" dy="0">非关键</tspan></text><text x="52" y="216" font-size="18" fill="#356453"><tspan x="52" dy="0">符合该项判据</tspan></text><text x="52" y="251" font-size="16" fill="#243b35"><tspan x="52" dy="0">总体符合此项；原文将外部解码列为非核心指标。</tspan></text><text x="52" y="326" font-size="13" fill="#5c6a61"><tspan x="52" dy="0">预注册解码</tspan></text><rect x="30" y="376" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="410" font-size="22" fill="#243b35"><tspan x="52" dy="0">IIT · 内容持续</tspan></text><text x="52" y="443" font-size="14" fill="#725637"><tspan x="52" dy="0">关键：激活＋RSA</tspan></text><text x="52" y="476" font-size="18" fill="#356453"><tspan x="52" dy="0">通过判据，保留限制</tspan></text><text x="52" y="511" font-size="16" fill="#243b35"><tspan x="52" dy="0">达到事先汇总判据；方向表征未持续，不能写成所有内容均得到</tspan><tspan x="52" dy="24">支持。</tspan></text><text x="52" y="586" font-size="13" fill="#5c6a61"><tspan x="52" dy="0">预注册激活与RSA</tspan></text><rect x="30" y="636" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="670" font-size="22" fill="#243b35"><tspan x="52" dy="0">IIT · 持续后部同步</tspan></text><text x="52" y="703" font-size="14" fill="#725637"><tspan x="52" dy="0">关键</tspan></text><text x="52" y="736" font-size="18" fill="#9c422f"><tspan x="52" dy="0">预测受挑战</tspan></text><text x="52" y="771" font-size="16" fill="#243b35"><tspan x="52" dy="0">预注册PPC及新增DFC均未给出要求的持续模式。</tspan></text><text x="52" y="846" font-size="13" fill="#5c6a61"><tspan x="52" dy="0">PPC原分析；DFC探索分析分列</tspan></text><rect x="565" y="116" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="587" y="150" font-size="22" fill="#243b35"><tspan x="587" dy="0">GNWT · PFC内容解码</tspan></text><text x="587" y="183" font-size="14" fill="#725637"><tspan x="587" dy="0">关键</tspan></text><text x="587" y="216" font-size="18" fill="#356453"><tspan x="587" dy="0">结果不确定</tspan></text><text x="587" y="251" font-size="16" fill="#243b35"><tspan x="587" dy="0">类别可解码；方向跨方式不一致，扩展图7判为不确定。</tspan></text><text x="587" y="326" font-size="13" fill="#5c6a61"><tspan x="587" dy="0">预注册解码</tspan></text><rect x="565" y="376" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="587" y="410" font-size="22" fill="#243b35"><tspan x="587" dy="0">GNWT · 开始与消失时点燃</tspan></text><text x="587" y="443" font-size="14" fill="#725637"><tspan x="587" dy="0">激活关键；RSA非关键</tspan></text><text x="587" y="476" font-size="18" fill="#9c422f"><tspan x="587" dy="0">预测受挑战</tspan></text><text x="587" y="511" font-size="16" fill="#243b35"><tspan x="587" dy="0">出现时有信号，消失后通常没有；此预测受挑战。</tspan></text><text x="587" y="586" font-size="13" fill="#5c6a61"><tspan x="587" dy="0">原激活判据；探索控制另列</tspan></text><rect x="565" y="636" width="505" height="240" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="587" y="670" font-size="22" fill="#243b35"><tspan x="587" dy="0">GNWT · PFC长程联系</tspan></text><text x="587" y="703" font-size="14" fill="#725637"><tspan x="587" dy="0">关键</tspan></text><text x="587" y="736" font-size="18" fill="#356453"><tspan x="587" dy="0">原分析／新增分析分开</tspan></text><text x="587" y="771" font-size="16" fill="#243b35"><tspan x="587" dy="0">预注册相位PPC未支持；新增幅度DFC较符合预测。</tspan></text><text x="587" y="846" font-size="13" fill="#5c6a61"><tspan x="587" dy="0">严格保留PPC／DFC的身份差异</tspan></text></g></svg>
