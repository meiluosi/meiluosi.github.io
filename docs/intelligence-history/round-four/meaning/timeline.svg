<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1320" role="img" aria-label="意义与意识问题的十二个选读节点"><title>意义与意识问题的十二个选读节点</title><rect width="1100" height="1320" fill="#f4f3e9"/><g font-family="system-ui, -apple-system, PingFang SC, sans-serif"><text x="35" y="48" font-size="27" fill="#243b35"><tspan x="35" dy="0">问题如何变化：1980—2025</tspan></text><text x="35" y="82" font-size="16" fill="#5c6a61"><tspan x="35" dy="0">按书目年排序；每份载体都保留版本与未读范围，间距不代表年份。</tspan></text><rect x="30" y="109" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="139" font-size="23" fill="#85622f"><tspan x="49" dy="0">1980</tspan></text><text x="143" y="139" font-size="21" fill="#243b35"><tspan x="143" dy="0">规则是否足以理解</tspan></text><text x="143" y="170" font-size="16" fill="#52695a"><tspan x="143" dy="0">把形式程序与理解的构成条件分开</tspan></text><text x="830" y="139" font-size="12" fill="#61716a"><tspan x="830" dy="0">searle-1980</tspan></text><rect x="30" y="206" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="236" font-size="23" fill="#85622f"><tspan x="49" dy="0">1990</tspan></text><text x="143" y="236" font-size="21" fill="#243b35"><tspan x="143" dy="0">符号怎样落地</tspan></text><text x="143" y="267" font-size="16" fill="#52695a"><tspan x="143" dy="0">从辨别、范畴到可组合的名称</tspan></text><text x="830" y="236" font-size="12" fill="#61716a"><tspan x="830" dy="0">harnad-1990</tspan></text><rect x="30" y="303" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="333" font-size="23" fill="#85622f"><tspan x="49" dy="0">1995</tspan></text><text x="143" y="333" font-size="21" fill="#243b35"><tspan x="143" dy="0">访问是否等于体验</tspan></text><text x="143" y="364" font-size="16" fill="#52695a"><tspan x="143" dy="0">区分信息可用与现象性质</tspan></text><text x="830" y="333" font-size="12" fill="#61716a"><tspan x="830" dy="0">block-1995</tspan></text><rect x="30" y="400" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="430" font-size="23" fill="#85622f"><tspan x="49" dy="0">1995</tspan></text><text x="143" y="430" font-size="21" fill="#243b35"><tspan x="143" dy="0">机制之后还有什么</tspan></text><text x="143" y="461" font-size="16" fill="#52695a"><tspan x="143" dy="0">明确困难问题与桥接原则</tspan></text><text x="830" y="430" font-size="12" fill="#61716a"><tspan x="830" dy="0">chalmers-1995</tspan></text><rect x="30" y="497" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="527" font-size="23" fill="#85622f"><tspan x="49" dy="0">2011</tspan></text><text x="143" y="527" font-size="21" fill="#243b35"><tspan x="143" dy="0">怎样解释意识访问</tspan></text><text x="143" y="558" font-size="16" fill="#52695a"><tspan x="143" dy="0">全局可用、点燃与神经可检验承诺</tspan></text><text x="830" y="527" font-size="12" fill="#61716a"><tspan x="830" dy="0">dehaene-changeux-2011</tspan></text><rect x="30" y="594" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="624" font-size="23" fill="#85622f"><tspan x="49" dy="0">2020</tspan></text><text x="143" y="624" font-size="21" fill="#243b35"><tspan x="143" dy="0">只有形式能学到什么</tspan></text><text x="143" y="655" font-size="16" fill="#52695a"><tspan x="143" dy="0">区分形式与交际意义的学习条件</tspan></text><text x="830" y="624" font-size="12" fill="#61716a"><tspan x="830" dy="0">bender-koller-2020</tspan></text><rect x="30" y="691" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="721" font-size="23" fill="#85622f"><tspan x="49" dy="0">2022</tspan></text><text x="143" y="721" font-size="21" fill="#243b35"><tspan x="143" dy="0">意义是否必需指称</tspan></text><text x="143" y="752" font-size="16" fill="#52695a"><tspan x="143" dy="0">以概念角色提出明确反方</tspan></text><text x="830" y="721" font-size="12" fill="#61716a"><tspan x="830" dy="0">piantadosi-hill-2022</tspan></text><rect x="30" y="788" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="818" font-size="23" fill="#85622f"><tspan x="49" dy="0">2022</tspan></text><text x="143" y="818" font-size="21" fill="#243b35"><tspan x="143" dy="0">分析优化后如何锁定</tspan></text><text x="143" y="849" font-size="16" fill="#52695a"><tspan x="143" dy="0">记录数据拆分、版本与模态例外</tspan></text><text x="830" y="818" font-size="12" fill="#61716a"><tspan x="830" dy="0">prereg-v4-2022</tspan></text><rect x="30" y="885" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="915" font-size="23" fill="#85622f"><tspan x="49" dy="0">2023</tspan></text><text x="143" y="915" font-size="21" fill="#243b35"><tspan x="143" dy="0">如何让理论共同受检验</tspan></text><text x="143" y="946" font-size="16" fill="#52695a"><tspan x="143" dy="0">共同约定内容、持续与联系预测</tspan></text><text x="830" y="915" font-size="12" fill="#61716a"><tspan x="830" dy="0">melloni-2023</tspan></text><rect x="30" y="982" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="1012" font-size="23" fill="#85622f"><tspan x="49" dy="0">2023</tspan></text><text x="143" y="1012" font-size="21" fill="#243b35"><tspan x="143" dy="0">体验怎样对应因果结构</tspan></text><text x="143" y="1043" font-size="16" fill="#52695a"><tspan x="143" dy="0">4.0公理、公设与解释性同一</tspan></text><text x="830" y="1012" font-size="12" fill="#61716a"><tspan x="830" dy="0">iit4-2023</tspan></text><rect x="30" y="1079" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="1109" font-size="23" fill="#85622f"><tspan x="49" dy="0">2025</tspan></text><text x="143" y="1109" font-size="21" fill="#243b35"><tspan x="143" dy="0">哪些预测承担了失败</tspan></text><text x="143" y="1140" font-size="16" fill="#52695a"><tspan x="143" dy="0">逐项保留通过、挑战与不确定</tspan></text><text x="830" y="1109" font-size="12" fill="#61716a"><tspan x="830" dy="0">cogitate-2025</tspan></text><rect x="30" y="1176" width="1040" height="82" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="49" y="1206" font-size="23" fill="#85622f"><tspan x="49" dy="0">2025</tspan></text><text x="143" y="1206" font-size="21" fill="#243b35"><tspan x="143" dy="0">分歧如何推动下一步</tspan></text><text x="143" y="1237" font-size="16" fill="#52695a"><tspan x="143" dy="0">并列理论回应与实施偏离</tspan></text><text x="830" y="1206" font-size="12" fill="#61716a"><tspan x="830" dy="0">cogitate-supp-2025</tspan></text></g></svg>
