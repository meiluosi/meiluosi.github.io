ch","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-gentner-1983","year":1983,"dateBasis":"publication","dateLabel":"1983","routeIds":["symbolic-logic","learning-efficiency"],"branch":"类比与关系结构","title":"类比为何偏向关系结构而非表面属性？","status":"claims-reviewed","sourceIds":["gentner-1983"],"question":"当两个领域的对象不同，哪些知识仍可迁移？","mechanism":"将源域对象映射到目标域，优先保留关系及被高阶关系联系起来的结构，产生目标域的候选推论。","assumptions":"依赖给定的心理知识表征；谓词匹配按同一性处理，通常采用一对一对象对应，但原文允许例外。","limits":"映射产生候选推论，仍需评价可信性；原文的简要行为证据未在本批复验。类比偏好不保证迁移知识为真。","nextQuestion":"结构相同但结论为假的类比，能否被独立的验证步骤拒绝？","baselineEventId":"e-gentner-1983","claims":[{"id":"e-gentner-1983-c1","text":"映射规则区分对象属性、对象间关系与高阶关系；系统性原则偏好彼此连接的关系系统。","sourceId":"gentner-1983","locator":"印刷158页三条规则、163–165页系统性讨论","basis":"source-reported","independentlyReplicated":false},{"id":"e-gentner-1983-c2","text":"候选推论需要后续合理性评价，结构映射并不代替该阶段。","sourceId":"gentner-1983","locator":"印刷165页脚注11","basis":"source-reported","independentlyReplicated":false},{"id":"e-gentner-1983-c3","text":"此处系统性指关系结构的连贯性；与Fodor讨论的能力成组出现需分别定义。","sourceId":"gentner-1983","locator":"印刷158及163–165页；与Fodor §3.2的本站比较","basis":"editorial-inference","independentlyReplicated":false}]},{"id":"e-fodor-pylyshyn-1988","year":1988,"dateBasis":"publication","dateLabel":"1988","routeIds":["learning-efficiency","symbolic-logic","connectionist"],"branch":"系统性争论","title":"相关认知能力为什么成组出现？","status":"claims-reviewed","sourceIds":["fodor-pylyshyn-1988","lake-baroni-2018","lake-baroni-2023"],"question":"理解某种关系为什么通常伴随理解相关的角色交换，而不是互不相关的能力清单？","mechanism":"从系统性、组合性与推理一致性论证：表征需要组成结构，处理过程需要对该结构敏感；系统性论证不依赖无界生产性的理想化。","assumptions":"作者把相关能力成组出现视作需要解释的经验前提；从语言到思想还使用表达思想的桥接前提；关于非语言动物的论证包含待经验检验的主张。","limits":"这不是证明任何神经网络都无法完成组合任务。作者承认网络可以表现系统性，争点是架构如何解释并产生这种规律；人类系统性的范围也需任务与表现约束。","nextQuestion":"训练诱导的规则能否在新角色、新长度与新分布下持续工作？这些检验分别触及原论证哪一前提？","claims":[{"id":"e-fodor-pylyshyn-1988-c1","text":"§3.2将系统性表述为某些理解或表达能力之间的内在联系，并明确它不需要无界能力的理想化。","sourceId":"fodor-pylyshyn-1988","locator":"印刷36–40页，§3.2","basis":"source-reported","independentlyReplicated":false},{"id":"e-fodor-pylyshyn-1988-c2","text":"§3.4和§3.5承认可以构造表现系统性的网络；作者要求说明为什么相关能力由机制成组产生，而非仅额外规定其存在。","sourceId":"fodor-pylyshyn-1988","locator":"印刷47–50页，尤其50页","basis":"source-reported","independentlyReplicated":false},{"id":"e-fodor-pylyshyn-1988-c3","text":"把SCAN或MLC某一切分得分直接视为整场架构争论的裁决，会跨过能力定义、训练机制及泛化范围的对齐步骤。","sourceId":"fodor-pylyshyn-1988","locator":"Fodor与Pylyshyn §3.2–3.5；比较依据另见关联来源SCAN PDF5–6及MLC 119页Discussion；本站分析","basis":"editorial-inference","independentlyReplicated":false},{"id":"e-fodor-pylyshyn-1988-c4","text":"作者将节点的说法扩展到聚合活动模式，并区分认知架构与神经实现；不能把其论证简单还原为只批评局部单元表征。","sourceId":"fodor-pylyshyn-1988","locator":"印刷5页脚注1、10–11页层次区分、15页脚注10","basis":"source-reported","independentlyReplicated":false}],"baselineEventId":"e-fodor-pylyshyn-1988"},{"id":"e-smolensky-1988-bbs","year":1988,"dateBasis":"publication","dateLabel":"1988","routeIds":["connectionist","symbolic-logic","learning-efficiency","cognitive-architectures"],"branch":"分布式组成结构","title":"分布式状态能否具有组成结构？","status":"claims-reviewed","sourceIds":["smolensky-1988-bbs","fodor-pylyshyn-1988"],"question":"连接主义是否只能把一个完整思想当成没有结构的原子？","mechanism":"Smolensky在概念层把活动模式分解成子模式，在次概念层分析单元活动；咖啡例中组成部分随语境变化，符号描述作为近似高层描述。","assumptions":"这是一种研究纲领及表征分析；不能把作者认为可行的方向当作已经完成的普遍系统性保证。","limits":"目标文§7.2明说复杂结构仍有难题；作者回应区分共同抽象的不同实现与精确执行符号原语。Fodor与Pylyshyn对语境变化下如何保证推理有效提出直接异议。","nextQuestion":"能否构造具有明确绑定与解绑定规则的分布式表征，再分开检验结构表达、操作和学习？","claims":[{"id":"e-smolensky-1988-bbs-c1","text":"§7.2直接点名Fodor与Pylyshyn1988，并以分布式子模式的组成结构反对把批评推广到所有分布式网络。","sourceId":"smolensky-1988-bbs","locator":"PDF/印刷16–17页，§7.2","basis":"source-reported","independentlyReplicated":false},{"id":"e-smolensky-1988-bbs-c2","text":"作者回应图1区分精确执行符号原语和直接以连接主义形式实现认知抽象；后一方向要求重建架构。","sourceId":"smolensky-1988-bbs","locator":"PDF/印刷62页，回应§1.1图1","basis":"source-reported","independentlyReplicated":false},{"id":"e-smolensky-1988-bbs-c3","text":"Fodor与Pylyshyn明确批评Smolensky的咖啡例与近似语境等价，追问关系相似怎样保证推理有效。","sourceId":"fodor-pylyshyn-1988","locator": 果会影响后续决策，怎样求整个序列的最优收益或代价？","mechanism":"用当前状态、当前收益与下一状态的续接价值构造取最大或最小的函数方程；引言用搜盒取球和资源分配说明。","assumptions":"定理1要求状态变换留在定义域，收益有界、续接系数绝对值统一小于1，且原文还列出非负条件；不能删掉条件只剩“最优”。","limits":"论文主要给出方程与定理陈述，详细证明另行发表；已知算子下求解价值与从未知环境经验学习是不同问题。1957专著仍未读。","nextQuestion":"哪些环境信息必须由模型提供，哪些可以由样本估计？共享参数后，原方程的性质还剩哪些？","claims":[{"id":"e-bellman-1952-c1","text":"引言把许多最优操作序列问题化为选择最优第一步，并给出 f(p)=max/min T_k(f) 的形式。","sourceId":"bellman-1952","locator":"印刷716页，§1式1.1–1.2","basis":"source-reported","independentlyReplicated":false},{"id":"e-bellman-1952-c2","text":"定理1在所列有界性、续接系数和定义域条件下声称有唯一有界解；本文说明证明使用逐次逼近，详细证明另文给出。","sourceId":"bellman-1952","locator":"印刷717页定理1、718页说明、719页末注","basis":"source-reported","independentlyReplicated":false}],"baselineEventId":null},{"id":"e-strips-1971","year":1971,"dateBasis":"publication","dateLabel":"1971","routeIds":["symbolic-logic","causal-world-models"],"branch":"规划与行动模型","title":"如何在世界模型之间搜索行动计划？","status":"claims-reviewed","sourceIds":["strips-1971-ijcai"],"question":"怎样减少把整个行动序列都交给定理证明器造成的搜索困难？","mechanism":"把模型内的证明与模型之间的搜索分开；用前提和增删列表描述算子，以未完成证明形成差异，再寻找相关算子及其子目标。","assumptions":"需给定初始逻辑模型、算子及目标；实际行动程序与模型中的算子应用分开；派生事实还需跟踪其依赖的原始事实。","limits":"原文世界模型允许一阶公式，不能直接缩写成所有现代教材中的简化STRIPS定义。所得计划不保证最短；能规划爬箱不等于当时机器人能执行。","nextQuestion":"如何在行动效果不确定、观测不完整或模型错误时修正计划？","baselineEventId":null,"claims":[{"id":"e-strips-1971-c1","text":"作者明确分离模型内定理证明和模型间搜索，并区分规划算子与实际执行的行动程序。","sourceId":"strips-1971-ijcai","locator":"608页引言及脚注","basis":"source-reported","independentlyReplicated":false},{"id":"e-strips-1971-c2","text":"算子以适用条件和增删列表描述；删除原始事实后，还需检查依赖它的非原始事实是否仍有效。","sourceId":"strips-1971-ijcai","locator":"609页§II.A、612–613页§III.B","basis":"source-reported","independentlyReplicated":false},{"id":"e-strips-1971-c3","text":"615页报告灯开关问题解非最优，并注明当时SRI机器人不能爬箱和开灯。","sourceId":"strips-1971-ijcai","locator":"615页§IV及脚注","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-pearl-1982","year":1982,"dateBasis":"publication","dateLabel":"1982","routeIds":["causal-world-models"],"branch":"树上的概率推断","title":"局部消息怎样完成全局信念更新？","status":"claims-reviewed","sourceIds":["pearl-1982"],"question":"如何在分层推理系统中传播新证据，同时避免证据被重复计算？","mechanism":"在给定概率树中分离来自下方的似然支持与上方的先验支持；每条边传递局部消息，向下更新时移除子节点此前贡献。","assumptions":"每个节点至多一个父节点，离散状态及条件概率已给定；子树在给定父状态时条件独立。","limits":"单遍传播与有限收敛结论针对本文树结构；没有解决结构学习、任意有环推理或因果识别。","nextQuestion":"当依赖图包含环或概率未知时，哪些正确性与收敛保证仍成立？","baselineEventId":null,"claims":[{"id":"e-pearl-1982-c1","text":"本文从单父节点概率树及局部条件独立出发，把每个节点后验分解为上下两部分支持的归一化乘积。","sourceId":"pearl-1982","locator":"133–134页，式1–6","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1982-c2","text":"父节点向子节点发送信息时，需要除去该子节点上一次已纳入的消息，避免同一证据回流后重复计算。","sourceId":"pearl-1982","locator":"135页，式10及其前文","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1982-c3","text":"作者用先自下而上、再自上而下的归纳论证树上的平衡值正确，并报告新信息单遍扩散的性质。","sourceId":"pearl-1982","locator":"136页 Characteristics／A Summary of Proofs","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-pearl-1995","year":1995,"dateBasis":"publication","dateLabel":"1995","routeIds":["causal-world-models"],"branch":"干预与可识别性","title":"观察分布何时足以回答干预问题？","status":"claims-reviewed","sourceIds":["pearl-1995-journal","cox-wermuth-1995"],"question":"没有随机实验时，什么额外假设使干预效果能从观察数据唯一确定？","mechanism":"把因果图解释为自治结构方程；干预替换指定机制并保留其他机制。借助后门、前门条件及干预演算，把符合条件的目标转成观察分布表达式。","assumptions":"图及其遗漏的边是领域假设；原文可识别性定义要求与图相容的正概率观察分布。前门要求中介截断所有有向路径、X至中介无后门、中介至Y的后门由X阻断。","limits":"图不是仅凭拟合自动验证的真相。Cox与Wermuth质疑现实中满足条件的把握；Pearl回应要求明确实际操作的副作用。677–678页把演算完备性列为当时开放问题，本记录不外推为今日状态。","nextQuestion":"哪些实验或背景证据能检验模型中最影响结论的缺失边与机制不变性？","baselineEventId":"e-pearl-1995","claims":[{"id":"e-pearl-1995-c1","text":"结构方程表达自治机制；原子干预通过替换被干预变量的方程，保留其他机制来定义干预分布。","sourceId":"pearl-1995-journal","locator":"§2.2，672–674页，式3–5与定义2","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1995-c2","text":"后门与前门定理在各自图条件下给出效应识别公式；非识别可由观察分布相同而干预效果不同的两个模型说明。","sourceId":"pearl-1995-journal","locator":"§3，674–676页，定义3–4、定理1–2及式6、9","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1995-c3","text":"三条演算规则分别允许在相应删边图的分离条件下增删观察、交换观察与行动、增删行动。","sourceId":"pearl-1995-journal","locator":"§4.3–4.4，677–679页，定理3与式10–21","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1995-c4","text":"Cox与Wermuth肯定计算框架，同时质疑后门／前门假设在实践中如何可靠成立，并要求说明设置变量时其他变量怎样变化。","sourceId":"cox-wermuth-1995","locator":"688–689页，完整评论","basis":"source-reported","independentlyReplicated":false},{"id":"e-pearl-1995-c5","text":"Pearl在回应中区分假想原子干预与实际操作；实际操作若影响其他机制，相关副作用需要明确建模。","sourceId":"pearl-1995-journal","locator":"回应§4，705–706页","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-rao-ballard-1999","year":1999,"dateBasis":"publication","dateLabel":"1999","routeIds":["causal-world-models","connectionist"],"branch":"视觉层级中的预测误差","title":"层间反馈能解释哪些视觉反应？","status":"claims-reviewed","sourceIds":["rao-ballard-1999"],"question":"局部视觉响应为何受更大范围的情境与高层反馈影响？","mechanism":"高层向低层传递预测，低层向上传递残差；在生成模型、噪声与先验下优化隐状态，并以较慢时间尺度学习连接权重。","assumptions":"模型拟合静态自然图像；最大后验目标包含方差加权误差及状态／权重先验，不仅是无条件误差最小化。","limits":"神经对应是机制假说；侧向相互作用是作者承认的替代解释。正文时序扩展未用于所报告模拟，不能把静态重建直接说成未来预测。","nextQuestion":"操纵高层反馈与局部侧向联系，能否产生可区分的反应预测？","baselineEventId":null,"claims":[{"id":"e-rao-ballard-1999-c1","text":"模型的前馈信号是预测残差，反馈携带预测；神经活动与突触学习分别由生成模型目标的梯度更新。","sourceId":"rao-ballard-1999","locator":"80页图1；85–86页Methods，式1–7","basis":"source-reported","independentlyReplicated":false},{"id":"e-rao-ballard-1999-c2","text":"图5模拟的32个误差单元中，28个在有反馈时呈现超过50%的端点抑制，取消反馈后剩5个；这些是作者模型结果。","sourceId":"rao-ballard-1999","locator":"83–84页，图5及相邻正文","basis":"source-reported","independentlyReplicated":false},{"id":"e-rao-ballard-1999-c3","text":"作者承认侧向作用也可能解释部分现象，并说明本文结果均来自静态图像，时序预测是后续扩展方向。","sourceId":"rao-ballard-1999","locator":"84页Discussion；86页Methods末","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-friston-2010","year":2010,"dateBasis":"publication","dateLabel":"2010","routeIds":["cybernetics-rl","causal-world-models"],"branch":"自由能原则 cator":"§IV.C，20–21页；§V.B，21–22页","basis":"source-reported","independentlyReplicated":false},{"id":"e-brooks-1986-c4","text":"期刊报告的避障经验带有限定：移动障碍刻意缓慢；快速物体或拥挤环境仍可能造成碰撞。","sourceId":"brooks-1986-journal","locator":"§IV.A，19页","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-brooks-1991","year":1991,"routeId":"embodied-dynamical","branch":"行为机器人","title":"Brooks：没有中央表征能做到哪里？","status":"claims-reviewed","source":{"url":"https://people.csail.mit.edu/brooks/papers/representation.pdf","version":"Intelligence without Representation；Rodney Brooks；Artificial Intelligence47,139–159；作者重排PDF12页","readingStatus":"selected-sections","readScope":"§6–8，PDF7–8、10–12；摘要、实机与增长限制、参考文献3","id":"brooks-1991","checkedAt":"2026-10-25","verification":"仅核对所列原文主张；未独立复现论文结果。","sha256":"c6eca85a62c4851bcb8679c848a6719c8129b14af71305a2f6cafdf0afe06f76"},"question":"是否必须先建立统一世界表征，才能产生有效行为？","mechanism":"完整感知—行动行为层在环境中运行，按固定拓扑互相影响；世界状态可直接触发行动。","assumptions":"论文针对简单智能和具体机器人；无需中央表征不等于没有内部状态、寄存器或局部表示。","claims":[{"text":"§8明确提出层数、行为复杂度和学习的开放问题；报告时实机最多三层，六层为模拟。","locator":"§6.2、§8.1–8.3，PDF7–8、10–11","basis":"source-reported","id":"e-brooks-1991-c1","independentlyReplicated":false}],"limits":"通向人类智能的路线是作者研究假设，不能当作已完成结果。","criticism":"Wilson2002将环境影响与认知系统边界分开；本站不把这篇工作反推为由海德格尔启发，作者§7.5明确否认。","teachingExample":"物体已到夹爪视野时触发抓取，但寻找、接近和抓取仍需协同。","nextQuestion":"长期规划、反事实与新任务学习怎样融入？","baselineEventId":"e-brooks-1991","dateBasis":"publication","dateLabel":"1991","routeIds":["embodied-dynamical"],"previousRound":true},{"id":"e-varela-1991","year":1991,"dateBasis":"publication","dateLabel":"1991","routeIds":["embodied-dynamical"],"branch":"生成论","title":"认知如何通过感知行动形成一个有意义的世界？","status":"claims-reviewed","sourceIds":["varela-thompson-rosch-1991"],"question":"知觉是在恢复预先给定的世界，还是在感知运动耦合中形成可行动的世界？","mechanism":"以感知引导的行动及重复的感知运动模式为起点；把生物、心理与文化背景纳入身体性，强调耦合历史的可存续性。","assumptions":"原文是一项概念和研究纲领论证；书中引用的猫实验、感觉替代与神经实验在本批尚未回查，不能视为本批独立实验验证。","limits":"共同强调主体—环境关系，不意味着生成论与Gibson直接知觉论相同；生存可行性也不等于跨任务智能充分条件。","nextQuestion":"哪些干预能区分现成环境信息的检测、学习形成的感知运动规律和需要内部结构的任务？","claims":[{"id":"e-varela-1991-c1","text":"生成论的初步表述包括感知引导的行动，以及认知结构从重复感知运动模式中产生。","sourceId":"varela-thompson-rosch-1991","locator":"印刷172–173页，第8章","basis":"source-reported","independentlyReplicated":false},{"id":"e-varela-1991-c2","text":"作者赞同Gibson的部分生态立场，但明确不同意把环境不变项的直接检测作为相同研究策略；耦合本身不推出该检测论。","sourceId":"varela-thompson-rosch-1991","locator":"印刷203–205页，第9章","basis":"source-reported","independentlyReplicated":false},{"id":"e-varela-1991-c3","text":"作者以可存续的耦合历史而非最优性描述生成论，并指出具体机制还有待说明。","sourceId":"varela-thompson-rosch-1991","locator":"印刷205–207页，第9章","basis":"source-reported","independentlyReplicated":false}],"baselineEventId":"e-varela-1991"},{"id":"e-thelen-smith-1994","year":1994,"dateBasis":"publication","dateLabel":"1994（实读1996平装版）","routeIds":["embodied-dynamical"],"branch":"发展中的身体、任务与动力学","title":"动作模式怎样从身体与情境中形成？","status":"claims-reviewed","sourceIds":["thelen-smith-1994"],"question":"为什么婴儿的踏步、踢腿、姿态支持与独立行走会呈现不同的发展轨迹？","mechanism":"以身体、神经、任务及环境的实时配合解释动作；成分的不同变化速度与行为稳定性的改变共同形成发展转折。","assumptions":"必须明确所观察行为、身体条件和时间尺度，再用纵向记录与扰动检验具体机制；动力学原则不能独自给出发展日期。","limits":"本书并不否定自主神经振荡。作者明确说踢腿作为稳定吸引子的解释尚未经严格检验；这里登记的是作者汇总的行为研究及理论解释，未审查全部原始实验。","nextQuestion":"怎样将身体负荷、姿态支持、任务目标与练习历史分开操纵，区分动作出现及自主运用的条件？","baselineEventId":"e-thelen-smith-1994","claims":[{"id":"e-thelen-smith-1994-c1","text":"第1章区分踏步模式、姿态支持与独立行走，并用负重、水中支持及跑台情境说明动作表现受身体与任务条件影响。","sourceId":"thelen-smith-1994","locator":"第1章11–17页","basis":"source-reported","independentlyReplicated":false},{"id":"e-thelen-smith-1994-c2","text":"作者提出行为由多个成分在实时情境中协同形成，发展改变这些成分及其配合；行为变化的时间尺度需要分别说明。","sourceId":"thelen-smith-1994","locator":"第4章73–74、83–88页","basis":"source-reported","independentlyReplicated":false},{"id":"e-thelen-smith-1994-c3","text":"作者将变化程度与抗扰动能力作为研究行为稳定性的线索，同时明确承认踢腿的稳定吸引子解释尚未严格检验。","sourceId":"thelen-smith-1994","locator":"第4章81–82页及86–88页；图4.2","basis":"source-reported","independentlyReplicated":false},{"id":"e-thelen-smith-1994-c4","text":"本书不否定自主神经振荡，也不认为抽象动力学原则足以直接预测具体发展事件；仍需领域经验研究。","sourceId":"thelen-smith-1994","locator":"第1章20页注1；第4章71–72页","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-beer-1995","year":1995,"dateBasis":"publication","dateLabel":"1995","routeIds":["embodied-dynamical"],"branch":"主体—环境耦合的形式分析","title":"相同行为能否来自不同的耦合机制？","status":"claims-reviewed","sourceIds":["beer-1995"],"question":"怎样形式化主体与环境的相互影响，并辨别产生相似行为的不同内部机制？","mechanism":"将主体和环境写成通过感知与运动映射耦合的动力系统，以联合轨迹是否满足任务约束描述适应；用进化得到的模拟行走控制器演示分析。","assumptions":"基本分析采用连续时间、确定性和有界／收敛动力学假设；主体、身体模型及任务约束在示例中预先给定。持续相互作用并不要求系统已落入稳定极限集。","limits":"模拟昆虫的行走不构成生物机制验证或一般认知理论。正常步态相似不能识别内部动力学；感觉丧失后的表现也依赖进化条件。文章保留内部状态与表征的区别，并把语言、抽象推理及复杂系统扩展留作后续问题。","nextQuestion":"在正常行为相近的控制器之间，哪些感觉或身体扰动能区分其机制，同时排除重新学习的影响？","baselineEventId":null,"claims":[{"id":"e-beer-1995-c1","text":"主体与环境通过相互作用改变彼此的动力学；划分边界具有观察视角的选择性，但这不等于任一方可任意控制另一方。","sourceId":"beer-1995","locator":"§3.1，181–183页；式5","basis":"source-reported","independentlyReplicated":false},{"id":"e-beer-1995-c2","text":"在给定身体模型与任务目标的模拟中，不同感觉反馈条件产生反射式、节律发生式和混合控制器；正常条件下均能形成行走。","sourceId":"beer-1995","locator":"§4.1，186–192页","basis":"source-reported","independentlyReplicated":false},{"id":"e-beer-1995-c3","text":"对所分析的控制器，正常行走可以相似，传感器移除后的差异却揭示不同机制；混合控制器能够在无权重更新时适应反馈变化。","sourceId":"beer-1995","locator":"191页图6；§4.2.4，203–204页","basis":"source-reported","independentlyReplicated":false},{"id":"e-beer-1995-c4","text":"Beer明确区分内部状态与内部表征，认为是否采用表征解释需要检查具体系统，而非由存在内部状态直接推出。","sourceId":"beer-1995","locator":"§5.4，210–211页","basis":"source-reported","independentlyReplicated":false},{"id":"e-beer-1995-c5","text":"文章自称为待发展的分析框架，承认复杂系统扩展、语言和抽象推理仍待解释；持续耦合也可使系统长期保持暂态。","sourceId":"beer-1995","locator":"§5.2.3，207页；§5.3，209–210页；§5.5，211–212页","basis":"source-reported","independentlyReplicated":false}]},{"id":"e-klyubin-2005","year":2005,"dateBasis":"publication","dateLabel":"2005","routeIds":["cybernetics-rl","embodied-dynamical"],"branch":"赋能度与感知行动通道","title":"行动能带来多少可区分的感知结果？","status":"claims-reviewed","sourceIds":["klyubin-2005"],"question":"能否以较通用的内在准则，评价一个主体潜在的可感知控制能力？","mechanism":"把一段可自主选择的行动作为通道输入、未来感觉作为输出，最大化两者互信息得到通道容量；用它评价可区分的潜在行动效果。","assumptions":"动作序列可被干预选择；需要行动到感知的通道模型、观察尺度和时间跨度。本文实验还固定起点、形态约束及小的感知／动作数量代价。","limits":"容量描述潜能，不能用既有策略下互信息直接替代；高赋能不保证任务奖励或生存。作者的黑暗中自产闪光例表明，只要可控且可感知，常识上无用的能力也会被保留。","nextQuestion":"固定可达状态后，改变传感器、行动代价和时间跨度，赋能偏好会怎样改变？","baselineEventId":null,"claims":[{"id":"e-klyubin-2005-c1","text":"赋能度定义为行动序列到未来感知通道的容量，即在允许的行动分布上最大化互信息；它评价潜在可控性，而非实际执行频率。","sourceId":"klyubin-2005","locator":"§2.1–2.2，129–130页，式1–3；§4，134页","basis":"source-reported","independentlyReplicated":false},{"id":"e-klyubin-2005-c2","text":"本文两项演化实验分别固定动作集合优化传感器、固定传感器优化动作；以四步赋能并加小的规模惩罚评价形态。","sourceId":"klyubin-2005","locator":"§2.3及§3，131–133页；式4","basis":"source-reported","independentlyReplicated":false},{"id":"e-klyubin-2005-c3","text":"作者明确指出，只要主体能发出并看到闪光，赋能准则会保留相应能力，无论该能力是否在常识意义上有用。","sourceId":"klyubin-2005","locator":"§2.3，131页","basis":"source-reported","independentlyReplicated":false}]}]},"routeRelations":{"learning-efficiency":[{"id":"r-smolensky-fodor-response","fromId":"e-fodor-pylyshyn-1988","toId":"e-smolensky-1988-bbs","type":"direct-response","status":"source-checked","evidenceSourceIds":["smolensky-1988-bbs"],"locator":"§7.2，印刷16–17页","explanation":"直接点名并回应；同年往复，不推断明确先后顺序。"},{"id":"r-fodor-smolensky-objection","fromId":"e-smolensky-1988-bbs","toId":"e-fodor-pylyshyn-1988","type":"direct-critique","status":"source-checked","evidenceSourceIds":["fodor-pylyshyn-1988"],"locator":"§3.3，印刷45–46页","explanation":"直接批评咖啡例及语境近似；关系图应允许同年双向争论。"},{"id":"r-gentner-fodor-terminology","fromId":"e-gentner-1983","toId":"e-fodor-pylyshyn-1988","type":"editorial-comparison","status":"editorial","evidenceSourceIds":["gentner-1983","fodor-pylyshyn-1988"],"locator":"Gentner印刷158、163–165页；Fodor §3.2","explanation":"比较同名术语的不同解释目标，不将词语相同当作思想继承。"},{"id":"r-fodor-scan-evaluation","fromId":"e-fodor-pylyshyn-1988","toId":"e-lake-baroni-2018","type":"motivated-evaluation","status":"so /g>\u003cg>\u003ctitle>转为评测问题：SCAN作者明确把隔离原语实验联系到Fodor等人的思想实验；这是特定模型与训练协议的操作化检验，不等于原架构论证的所有前提。\u003c/title>\u003cpath d=\"M664 616H922V1217H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"928\" y=\"916.5\" font-size=\"12\" fill=\"#4b736d\">R4\u003c/text>\u003c/g>\u003cg>\u003ctitle>实证回应：MLC直接回应系统性争论，提出经元训练获得组合能力的实例；同时明确未解决原论证的所有挑战，分布外结构和新符号仍有限制。\u003c/title>\u003cpath d=\"M664 616H986V1655H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"992\" y=\"1135.5\" font-size=\"12\" fill=\"#a44939\">R5\u003c/text>\u003c/g>\u003cg>\u003ctitle>本站比较：本站比较经验调整响应与学习隐藏表示；1986论文引用的是Rosenblatt专著，不能据此画成对1958论文的直接引用边。\u003c/title>\u003cpath d=\"M664 178H1050V487H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow)\"/>\u003ctext x=\"1056\" y=\"332.5\" font-size=\"12\" fill=\"#4b736d\">R6\u003c/text>\u003c/g>\u003ca href=\"#e-rosenblatt-1958\" data-node=\"e-rosenblatt-1958\" aria-label=\"识别偏向怎样随经验改变？\">\u003ctitle>在连接结构含随机性的系统中，记忆与泛化能否由物理参数和环境统计关系解释？\u003c/title>\u003crect x=\"34\" y=\"130\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"155\" font-size=\"13\" fill=\"#5c6e62\">1958 · 经验改变识别偏向 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"188\" font-size=\"18\" fill=\"#203d3a\">识别偏向怎样随经验改变？\u003c/text>\u003c/a>\u003ca href=\"#e-gentner-1983\" data-node=\"e-gentner-1983\" aria-label=\"类比为何偏向关系结构而非表面属性？\">\u003ctitle>当两个领域的对象不同，哪些知识仍可迁移？\u003c/title>\u003crect x=\"34\" y=\"276\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"301\" font-size=\"13\" fill=\"#5c6e62\">1983 · 类比与关系结构 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"334\" font-size=\"18\" fill=\"#203d3a\">类比为何偏向关系结构而非表面属性？\u003c/text>\u003c/a>\u003ca href=\"#e-rumelhart-1986\" data-node=\"e-rumelhart-1986\" aria-label=\"隐藏单元怎样获得学习信号？\">\u003ctitle>任务只指定输入和目标输出时，怎样学习未被直接指定的内部表 defs>\u003cmarker id=\"arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0L7,3.5L0,7\" fill=\"context-stroke\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"32\" y=\"42\" font-size=\"25\" fill=\"#203d3a\">连接主义、统计学习与表征路线 · 分支与关系\u003c/text>\u003ctext x=\"32\" y=\"78\" font-size=\"14\" fill=\"#203d3a\">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。\u003c/text>\u003cg>\u003ctitle>直接回应：直接点名并回应；同年往复，不推断明确先后顺序。\u003c/title>\u003cpath d=\"M664 616H730V779H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"736\" y=\"697.5\" font-size=\"12\" fill=\"#a44939\">R1\u003c/text>\u003c/g>\u003cg>\u003ctitle>直接批评：直接批评咖啡例及语境近似；关系图应允许同年双向争论。\u003c/title>\u003cpath d=\"M664 762H794V633H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"800\" y=\"697.5\" font-size=\"12\" fill=\"#a44939\">R2\u003c/text>\u003c/g>\u003cg>\u003ctitle>直接批评：Rosenblatt明确讨论并批评包含McCulloch与Pitts在内的确定性模型，转向未知随机连接的统计分析；这是作者立场，不表示早期形式结果已被否定。\u003c/title>\u003cpath d=\"M664 178H858V341H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"864\" y=\"259.5\" font-size=\"12\" fill=\"#a44939\">R3\u003c/text>\u003c/g>\u003cg>\u003ctitle>本站比较：本站比较经验调整响应与学习隐藏表示；1986论文引用的是Rosenblatt专著，不能据此画成对1958论文的直接引用边。\u003c/title>\u003cpath d=\"M664 324H922V487H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow)\"/>\u003ctext x=\"928\" y=\"405.5\" font-size=\"12\" fill=\"#4b736d\">R4\u003c/text>\u003c/g>\u003cg>\u003ctitle>直接回应：作者明确说明这项工作始于回应Fodor与Pylyshyn的表征挑战；1990是期刊节点，不表示研究直到该年才开始。\u003c/title>\u003cpath d=\"M664 616H986V925H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"992\" y=\"770.5\" font-size=\"12\" fill=\"#a44939\">R5\u003c/text>\u003c/g>\u003cg>\u003ctitle>明确采用：1990文章明确沿用BBS论文的理论立场并形式化结构表示问题；本边不宣称BBS是张量积方法的首次 9.5\" font-size=\"12\" fill=\"#4b736d\">R3\u003c/text>\u003c/g>\u003cg>\u003ctitle>本站比较：PlaNet在相关工作中列出Ha与Schmidhuber；本图具体比较预训练控制器与在线潜在规划。引用本身不证明RSSM或CEM由前者直接继承。\u003c/title>\u003cpath d=\"M664 1200H922V1363H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow)\"/>\u003ctext x=\"928\" y=\"1281.5\" font-size=\"12\" fill=\"#4b736d\">R4\u003c/text>\u003c/g>\u003cg>\u003ctitle>本站比较：本站比较手工算子与学得动态模型中的行动搜索；状态语义、模型获取与执行反馈各不相同。\u003c/title>\u003cpath d=\"M664 324H986V1363H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow)\"/>\u003ctext x=\"992\" y=\"843.5\" font-size=\"12\" fill=\"#4b736d\">R5\u003c/text>\u003c/g>\u003cg>\u003ctitle>明确采用：Friston明确采用预测编码作为特定假设下的消息传递方案，并引用Rao–Ballard；这不证明统一原则已获实验验证，且所读版参考文献误列原文年份。\u003c/title>\u003cpath d=\"M664 762H1050V925H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"1056\" y=\"843.5\" font-size=\"12\" fill=\"#4b736d\">R6\u003c/text>\u003c/g>\u003ca href=\"#e-bellman-1952\" data-node=\"e-bellman-1952\" aria-label=\"如何把行动序列优化变成递推问题？\">\u003ctitle>每步操作的结果会影响后续决策，怎样求整个序列的最优收益或代价？\u003c/title>\u003crect x=\"34\" y=\"130\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"155\" font-size=\"13\" fill=\"#5c6e62\">1952 · 动态规划 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"188\" font-size=\"18\" fill=\"#203d3a\">如何把行动序列优化变成递推问题？\u003c/text>\u003c/a>\u003ca href=\"#e-strips-1971\" data-node=\"e-strips-1971\" aria-label=\"如何在世界模型之间搜索行动计划？\">\u003ctitle>怎样减少把整个行动序列都交给定理证明器造成的搜索困难？\u003c/title>\u003crect x=\"34\" y=\"276\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"301\" font-size=\"13\" fill=\"#5c6e62\">1971 · 规划与行动模型 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"334\" font-size=\"18\" fill=\"#203d3a\">如何在世界模型之间搜索行动计划？\u003c/text>\u003c/a>\u003ca href=\"#e-pearl-1982\" data-node=\"e-pearl- 4 616H794V925H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"800\" y=\"770.5\" font-size=\"12\" fill=\"#4b736d\">R2\u003c/text>\u003c/g>\u003cg>\u003ctitle>直接批评：批评明确针对当时待刊的标准模型提案，侧重知识类型及推理协调。两者同年，并非依靠期刊出版日期推断阅读顺序。\u003c/title>\u003cpath d=\"M664 908H858V779H668\" fill=\"none\" stroke=\"#a44939\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"864\" y=\"843.5\" font-size=\"12\" fill=\"#a44939\">R3\u003c/text>\u003c/g>\u003cg>\u003ctitle>架构比较：共同模型纳入后来的Soar，讨论多个记忆与学习机制；本边表示同名架构在比较中的位置，不把2017结构倒置为1987实现。\u003c/title>\u003cpath d=\"M664 324H922V925H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"928\" y=\"624.5\" font-size=\"12\" fill=\"#4b736d\">R4\u003c/text>\u003c/g>\u003cg>\u003ctitle>明确采用：Soar作者明确把物理符号系统假说列为其架构假说并引用Newell与Simon 1976；这证明采用关系，不证明该假说的必要性已获验证。\u003c/title>\u003cpath d=\"M664 178H986V341H668\" fill=\"none\" stroke=\"#4b736d\" stroke-width=\"1.7\"  marker-end=\"url(#arrow)\"/>\u003ctext x=\"992\" y=\"259.5\" font-size=\"12\" fill=\"#4b736d\">R5\u003c/text>\u003c/g>\u003ca href=\"#e-newell-simon-1976\" data-node=\"e-newell-simon-1976\" aria-label=\"符号系统如何成为可检验的智能假说？\">\u003ctitle>哪些结构和过程可能支持一般智能行动，又应怎样检验？\u003c/title>\u003crect x=\"34\" y=\"130\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"155\" font-size=\"13\" fill=\"#5c6e62\">1976 · 符号系统与启发式搜索 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"188\" font-size=\"18\" fill=\"#203d3a\">符号系统如何成为可检验的智能假说？\u003c/text>\u003c/a>\u003ca href=\"#e-soar-1987\" data-node=\"e-soar-1987\" aria-label=\"遇到僵局时如何求解并记住经验？\">\u003ctitle>如何让决策、子目标和学习在同一架构内持续协作？\u003c/title>\u003crect x=\"34\" y=\"276\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"301\" font-size=\"13\" fill=\"#5c6e62\">1987 · 问题求解与经验编译 · A批审校节点\u003c/text>\u003ctext x=\"52\" y=\"334\" font-size=\"18\" fill=\"#203d3a\">遇到僵局时如何求解并记住经验？  for(const [key,title] of [["question","探究的问题"],["mechanism","方法与机制"],["assumptions","成立条件"],["limits","证据边界"],["nextQuestion","下一问"]])h+='<h3>'+title+'</h3><p>'+esc(n[key])+'</p>';
 h+='<h3>主张与原文定位</h3>'+n.claims.map(c=>{const s=n.sources.find(s=>s.id===c.sourceId)||n.sources[0];const kind=({'source-reported':'原文主张','derived':'本次推导或验证','editorial-inference':'本站分析'})[c.basis]||c.basis;return '<div class="evidence"><p class="label">'+esc(kind)+'</p><p>'+esc(c.text)+'</p><p class="label"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a> · '+esc(c.locator)+' · '+(c.independentlyReplicated?'已验证所列范围，详见复现报告':'未独立复现')+'</p></div>';}).join("");
 h+='<details open><summary>阅读范围与来源版本</summary>'+n.sources.map(s=>'<div class="evidence"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a><p>'+esc(s.version)+'</p><p><strong>已读：</strong>'+esc(s.readScope)+'</p><p><strong>未覆盖：</strong>'+esc(s.unreadScope||'其余证明、附录或实验未全面验证，完整记录见第二轮笔记。')+'</p><p class="label">'+(s.sha256?'文件指纹已保存于笔记':'经网页正文或转录阅读，无本地PDF指纹')+'</p></div>').join("")+'</details>';
 h+='<p><a href="'+noteHref(n)+'">完整笔记</a> · <a href="research.json">可编辑研究数据</a></p>';
 if(id==='e-baird-1995')h+='<p><a href="replication/README.md">复现协议、结果、差异与图</a></p>';
 if(n.versionComparisonId)h+='<p><a href="versions/'+esc(n.versionComparisonId)+'.md">版本对照与未覆盖范围</a></p>';
 $("detail").innerHTML=h;

addEventListener("hashchange",()=>show(decodeURIComponent(location.hash.slice(1))));
