<svg xmlns="http://www.w3.org/2000/svg" width="1174" height="1670" viewBox="0 0 1174 1670" role="img" aria-label="概率推断、因果模型与世界模型路线：分支与关系"><title>概率推断、因果模型与世界模型路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">概率推断、因果模型与世界模型路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>本站比较：本站比较给定树上的信念更新与机制干预；不把条件独立语义自动升级为因果语义，也不据年代判定具体影响链。</title><path d="M664 470H730V633H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="551.5" font-size="12" fill="#4b736d">R1</text></g><g><title>本站比较：比较给定因果假设后的识别问题与学习结构先验的问题；后者的学习结果不免除前者的识别条件。</title><path d="M664 616H794V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="843.5" font-size="12" fill="#4b736d">R2</text></g><g><title>本站比较：本站区分静态视觉层级推断与按时间预测潜在状态的控制模型；没有把共同使用预测一词当作神经机制验证或直接继承证据。</title><path d="M664 762H858V1217H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="989.5" font-size="12" fill="#4b736d">R3</text></g><g><title>本站比较：PlaNet在相关工作中列出Ha与Schmidhuber；本图具体比较预训练控制器与在线潜在规划。引用本身不证明RSSM或CEM由前者直接继承。</title><path d="M664 1200H922V1363H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="1281.5" font-size="12" fill="#4b736d">R4</text></g><g><title>本站比较：本站比较手工算子与学得动态模型中的行动搜索；状态语义、模型获取与执行反馈各不相同。</title><path d="M664 324H986V1363H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="843.5" font-size="12" fill="#4b736d">R5</text></g><g><title>明确采用：Friston明确采用预测编码作为特定假设下的消息传递方案，并引用Rao–Ballard；这不证明统一原则已获实验验证，且所读版参考文献误列原文年份。</title><path d="M664 762H1050V925H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="1056" y="843.5" font-size="12" fill="#4b736d">R6</text></g><a href="../atlas.html#e-bellman-1952" data-node="e-bellman-1952" aria-label="如何把行动序列优化变成递推问题？"><title>每步操作的结果会影响后续决策，怎样求整个序列的最优收益或代价？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1952 · 动态规划 · A批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">如何把行动序列优化变成递推问题？</text></a><a href="../atlas.html#e-strips-1971" data-node="e-strips-1971" aria-label="如何在世界模型之间搜索行动计划？"><title>怎样减少把整个行动序列都交给定理证明器造成的搜索困难？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1971 · 规划与行动模型 · A批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">如何在世界模型之间搜索行动计划？</text></a><a href="../atlas.html#e-pearl-1982" data-node="e-pearl-1982" aria-label="局部消息怎样完成全局信念更新？"><title>如何在分层推理系统中传播新证据，同时避免证据被重复计算？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1982 · 树上的概率推断 · A批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">局部消息怎样完成全局信念更新？</text></a><a href="../atlas.html#e-pearl-1995" data-node="e-pearl-1995" aria-label="观察分布何时足以回答干预问题？"><title>没有随机实验时，什么额外假设使干预效果能从观察数据唯一确定？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">1995 · 干预与可识别性 · A批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">观察分布何时足以回答干预问题？</text></a><a href="../atlas.html#e-rao-ballard-1999" data-node="e-rao-ballard-1999" aria-label="层间反馈能解释哪些视觉反应？"><title>局部视觉响应为何受更大范围的情境与高层反馈影响？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">1999 · 视觉层级中的预测误差 · A批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">层间反馈能解释哪些视觉反应？</text></a><a href="../atlas.html#e-friston-2010" data-node="e-friston-2010" aria-label="感知更新与行动能否共享一个优化框架？"><title>怎样把感知、学习和行动放进同一生成模型框架，同时说明其生物学解释条件？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2010 · 自由能原则与主动推断 · A批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">感知更新与行动能否共享一个优化框架？</text></a><a href="../atlas.html#e-tenenbaum-2011" data-node="e-tenenbaum-2011" aria-label="少量经验如何支持丰富的结构推断？"><title>从稀疏数据作出广泛概括时，所需的先验和假设空间从何而来？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">2011 · 结构先验与分层学习 · A批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">少量经验如何支持丰富的结构推断？</text></a><a href="../atlas.html#e-ha-2018" data-node="e-ha-2018" aria-label="学到的环境模型能把控制学习转移到哪里？"><title>怎样压缩视觉与时间信息以支持控制，模型中的成功能否转移到原环境？</title><rect x="34" y="1152" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1177" font-size="13" fill="#5c6e62">2018 · 潜在动态与控制器学习 · A批审校节点</text><text x="52" y="1210" font-size="18" fill="#203d3a">学到的环境模型能把控制学习转移到哪里？</text></a><a href="../atlas.html#e-hafner-2019" data-node="e-hafner-2019" aria-label="如何从像素学到足以在线规划的动态？"><title>部分可观测环境中，怎样保持记忆并预测多种未来，用有限经验选择行动？</title><rect x="34" y="1298" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1323" font-size="13" fill="#5c6e62">2019 · 潜在空间在线规划 · A批审校节点</text><text x="52" y="1356" font-size="18" fill="#203d3a">如何从像素学到足以在线规划的动态？</text></a><a href="../atlas.html#e-schrittwieser-2019" data-node="e-schrittwieser-2019" aria-label="MuZero的版本、训练信息与泛化边界"><title>规划是否必须重建每个像素或真实状态？</title><rect x="34" y="