<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1086" viewBox="0 0 1110 1086" role="img" aria-label="认知架构与多机制协作路线：分支与关系"><title>认知架构与多机制协作路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">认知架构与多机制协作路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>直接批评：后文明确引用Anderson等2004，并讨论ACT-R的异质知识协调限制；不是对2004年双任务拟合结果的直接反驳。</title><path d="M664 616H730V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="697.5" font-size="12" fill="#a44939">R1</text></g><g><title>架构比较：共同模型明确将ACT-R纳入比较；后者讨论更晚版本，不能把所有2017年假设倒置成2004年的实现。</title><path d="M664 616H794V925H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="770.5" font-size="12" fill="#4b736d">R2</text></g><g><title>直接批评：批评明确针对当时待刊的标准模型提案，侧重知识类型及推理协调。两者同年，并非依靠期刊出版日期推断阅读顺序。</title><path d="M664 908H858V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="843.5" font-size="12" fill="#a44939">R3</text></g><g><title>架构比较：共同模型纳入后来的Soar，讨论多个记忆与学习机制；本边表示同名架构在比较中的位置，不把2017结构倒置为1987实现。</title><path d="M664 324H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="928" y="624.5" font-size="12" fill="#4b736d">R4</text></g><g><title>明确采用：Soar作者明确把物理符号系统假说列为其架构假说并引用Newell与Simon 1976；这证明采用关系，不证明该假说的必要性已获验证。</title><path d="M664 178H986V341H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="992" y="259.5" font-size="12" fill="#4b736d">R5</text></g><a href="../atlas.html#e-newell-simon-1976" data-node="e-newell-simon-1976" aria-label="符号系统如何成为可检验的智能假说？"><title>哪些结构和过程可能支持一般智能行动，又应怎样检验？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1976 · 符号系统与启发式搜索 · A批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">符号系统如何成为可检验的智能假说？</text></a><a href="../atlas.html#e-soar-1987" data-node="e-soar-1987" aria-label="遇到僵局时如何求解并记住经验？"><title>如何让决策、子目标和学习在同一架构内持续协作？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1987 · 问题求解与经验编译 · A批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">遇到僵局时如何求解并记住经验？</text></a><a href="../atlas.html#e-smolensky-1988-bbs" data-node="e-smolensky-1988-bbs" aria-label="分布式状态能否具有组成结构？"><title>连接主义是否只能把一个完整思想当成没有结构的原子？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1988 · 分布式组成结构 · A批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">分布式状态能否具有组成结构？</text></a><a href="../atlas.html#e-anderson-2004" data-node="e-anderson-2004" aria-label="并行模块如何形成连贯的认知过程？"><title>视觉、动作、目标和记忆各自工作时，怎样约束它们的相互协调？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">2004 · ACT-R模块协作 · A批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">并行模块如何形成连贯的认知过程？</text></a><a href="../atlas.html#e-chella-frixione-lieto-2017" data-node="e-chella-frixione-lieto-2017" aria-label="共同架构怎样协调异质知识？"><title>增加知识量以后，原型、实例和规则之间的冲突如何处理？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2017 · 知识类型与机制协调 · A批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">共同架构怎样协调异质知识？</text></a><a href="../atlas.html#e-laird-2017" data-node="e-laird-2017" aria-label="不同架构能共享哪些可检验约束？"><title>怎样从多个认知架构提取共同假设，支持累积研究？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2017 · 共同架构约束 · A批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">不同架构能共享哪些可检验约束？</text></a><text x="32" y="1044" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1068" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>