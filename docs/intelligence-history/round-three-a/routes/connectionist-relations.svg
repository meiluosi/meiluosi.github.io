<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="1670" viewBox="0 0 1302 1670" role="img" aria-label="连接主义、统计学习与表征路线：分支与关系"><title>连接主义、统计学习与表征路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">连接主义、统计学习与表征路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>直接回应：直接点名并回应；同年往复，不推断明确先后顺序。</title><path d="M664 616H730V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="697.5" font-size="12" fill="#a44939">R1</text></g><g><title>直接批评：直接批评咖啡例及语境近似；关系图应允许同年双向争论。</title><path d="M664 762H794V633H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="697.5" font-size="12" fill="#a44939">R2</text></g><g><title>直接批评：Rosenblatt明确讨论并批评包含McCulloch与Pitts在内的确定性模型，转向未知随机连接的统计分析；这是作者立场，不表示早期形式结果已被否定。</title><path d="M664 178H858V341H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="259.5" font-size="12" fill="#a44939">R3</text></g><g><title>本站比较：本站比较经验调整响应与学习隐藏表示；1986论文引用的是Rosenblatt专著，不能据此画成对1958论文的直接引用边。</title><path d="M664 324H922V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="405.5" font-size="12" fill="#4b736d">R4</text></g><g><title>直接回应：作者明确说明这项工作始于回应Fodor与Pylyshyn的表征挑战；1990是期刊节点，不表示研究直到该年才开始。</title><path d="M664 616H986V925H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="992" y="770.5" font-size="12" fill="#a44939">R5</text></g><g><title>明确采用：1990文章明确沿用BBS论文的理论立场并形式化结构表示问题；本边不宣称BBS是张量积方法的首次提出。</title><path d="M664 762H1050V925H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="1056" y="843.5" font-size="12" fill="#4b736d">R6</text></g><g><title>本站比较：本站比较梯度训练隐藏表示与大规模卷积训练的实现条件；没有把缺乏直接引文的两篇文章写成已考证的单线影响史。</title><path d="M664 470H1114V1217H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1120" y="843.5" font-size="12" fill="#4b736d">R7</text></g><g><title>本站比较：本站将基准分类成果与决策规则诊断并置；捷径学习的玩具实验不是对AlexNet表1结果的复现或推翻。</title><path d="M664 1200H1178V1363H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1184" y="1281.5" font-size="12" fill="#4b736d">R8</text></g><a href="../atlas.html#e-mcculloch-pitts-1943" data-node="e-mcculloch-pitts-1943" aria-label="固定神经网络能够实现哪些逻辑关系？"><title>怎样从连接结构计算网络行为，又从指定的逻辑条件构造网络？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1943 · 形式神经元与可实现性 · A批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">固定神经网络能够实现哪些逻辑关系？</text></a><a href="../atlas.html#e-rosenblatt-1958" data-node="e-rosenblatt-1958" aria-label="识别偏向怎样随经验改变？"><title>在连接结构含随机性的系统中，记忆与泛化能否由物理参数和环境统计关系解释？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1958 · 经验改变识别偏向 · A批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">识别偏向怎样随经验改变？</text></a><a href="../atlas.html#e-rumelhart-1986" data-node="e-rumelhart-1986" aria-label="隐藏单元怎样获得学习信号？"><title>任务只指定输入和目标输出时，怎样学习未被直接指定的内部表示？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1986 · 隐藏层误差分配 · A批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">隐藏单元怎样获得学习信号？</text></a><a href="../atlas.html#e-fodor-pylyshyn-1988" data-node="e-fodor-pylyshyn-1988" aria-label="相关认知能力为什么成组出现？"><title>理解某种关系为什么通常伴随理解相关的角色交换，而不是互不相关的能力清单？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">1988 · 系统性争论 · A批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">相关认知能力为什么成组出现？</text></a><a href="../atlas.html#e-smolensky-1988-bbs" data-node="e-smolensky-1988-bbs" aria-label="分布式状态能否具有组成结构？"><title>连接主义是否只能把一个完整思想当成没有结构的原子？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">1988 · 分布式组成结构 · A批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">分布式状态能否具有组成结构？</text></a><a href="../atlas.html#e-smolensky-1990" data-node="e-smolensky-1990" aria-label="分布式向量怎样保存谁处于哪个角色？"><title>把多个对象的特征叠加以后，怎样保留对象与角色的绑定并取回它们？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">1990 · 角色绑定与结构表示 · A批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">分布式向量怎样保存谁处于哪个角色？</text></a><a href="../atlas.html#e-rao-ballard-1999" data-node="e-rao-ballard-1999" aria-label="层间反馈能解释哪些视觉反应？"><title>局部视觉响应为何受更大范围的情境与高层反馈影响？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">1999 · 视觉层级中的预测误差 · A批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">层间反馈能解释哪些视觉反应？</text></a><a href="../atlas.html#e-krizhevsky-2012" data-node="e-krizhevsky-2012" aria-label="深层视觉模型怎样在大数据上训练并控制过拟合？"><title>如何让大容量卷积网络在有限计算与大量标注图像下取得有效识别结果？</title><rect x="34" y="1152" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1177" font-size="13" fill="#5c6e62">2012 · 大规模监督视觉训练 · A批审校节点</text><text x="52" y="1210" font-size="18" fill="#203d3a">深层视觉模型怎样在大数据上训练并控制过拟合？</text></a><a href="../atlas.html#e-geirhos-2020" data-node="e-geirhos-2020" aria-label="高测试分数究竟来自哪条决策规则？"><title>当多种规则都能拟合训练与同分布测试时，怎样判断学到了预期能力？</title><rect x="34" y="1298" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1323" font-size="13" fill="#5c6e62">2020 · 捷径学习与分布外检验 · A批审校节点</text><text x="52" y="1356" font-size="18" fill="#203d3a">高测试分数究竟来自哪条决策规则？</text></a><a href="../atlas.html#e-ellis-2021" data-node="e-ellis-2021" aria-label="能否同时学习程序库和搜索程序的方法？"><title>预先设计专用语言限制了程序合成，怎样从已解任务中学出可复用抽象？</title><rect x="34" y="1444" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1469" font-size="13" fill="#5c6e62">2021 · 程序归纳与学习搜索 · A批审校节点</text><text x="52" y="1502" font-size="18" fill="#203d3a">能否同时学习程序库和搜索程序的方法？</text></a><text x="32" y="1628" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1652" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>