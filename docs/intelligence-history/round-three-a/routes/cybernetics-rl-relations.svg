<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1232" viewBox="0 0 1100 1232" role="img" aria-label="控制论、强化学习与主动推断路线：分支与关系"><title>控制论、强化学习与主动推断路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">控制论、强化学习与主动推断路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>本站比较：本站比较函数方程的有界解与参数化学习更新的稳定性，不据此宣称直接历史影响。</title><path d="M664 324H730V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="405.5" font-size="12" fill="#4b736d">R1</text></g><g><title>本站比较：比较两种依赖条件的稳定性问题；不将控制回路与值函数迭代视为同一机制或宣称直接历史影响。</title><path d="M664 178H794V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="332.5" font-size="12" fill="#4b736d">R2</text></g><g><title>本站比较：本站比较运动先验下的行动与离散策略的预期价值分解；2010瞬时自由能与2015策略的预期自由能不写成相同目标式。</title><path d="M664 762H858V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="843.5" font-size="12" fill="#4b736d">R3</text></g><g><title>本站比较：赋能度评估可选择行动对感知的通道容量；自由能框架要求生成模型和先验。二者可在偏好、传感器与行动代价操纵下比较，不能按信息论用语相似合并。</title><path d="M664 616H922V779H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="697.5" font-size="12" fill="#4b736d">R4</text></g><a href="../atlas.html#e-wiener-1948" data-node="e-wiener-1948" aria-label="反馈为什么既能调节，也会引起振荡？"><title>发出正确指令，是否足以保证执行器达到目标？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1948 · 反馈与稳定性 · A批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">反馈为什么既能调节，也会引起振荡？</text></a><a href="../atlas.html#e-bellman-1952" data-node="e-bellman-1952" aria-label="如何把行动序列优化变成递推问题？"><title>每步操作的结果会影响后续决策，怎样求整个序列的最优收益或代价？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1952 · 动态规划 · A批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">如何把行动序列优化变成递推问题？</text></a><a href="../atlas.html#e-baird-1995" data-node="e-baird-1995" aria-label="共享参数怎样破坏表格方法的收敛？"><title>值函数能表示正确答案，为什么迭代仍会发散？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1995 · 函数逼近的稳定性 · A批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">共享参数怎样破坏表格方法的收敛？</text></a><a href="../atlas.html#e-klyubin-2005" data-node="e-klyubin-2005" aria-label="行动能带来多少可区分的感知结果？"><title>能否以较通用的内在准则，评价一个主体潜在的可感知控制能力？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">2005 · 赋能度与感知行动通道 · A批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">行动能带来多少可区分的感知结果？</text></a><a href="../atlas.html#e-friston-2010" data-node="e-friston-2010" aria-label="感知更新与行动能否共享一个优化框架？"><title>怎样把感知、学习和行动放进同一生成模型框架，同时说明其生物学解释条件？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2010 · 自由能原则与主动推断 · A批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">感知更新与行动能否共享一个优化框架？</text></a><a href="../atlas.html#e-friston-2015" data-node="e-friston-2015" aria-label="主动推断：为什么先去看线索？"><title>怎样把获取信息与达到偏好结果放进同一决策准则？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2015 · 主动推断 · 第二轮延续</text><text x="52" y="918" font-size="18" fill="#203d3a">主动推断：为什么先去看线索？</text></a><a href="../atlas.html#e-schrittwieser-2019" data-node="e-schrittwieser-2019" aria-label="MuZero的版本、训练信息与泛化边界"><title>规划是否必须重建每个像素或真实状态？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">2019 · 任务相关潜在模型与规划 · A批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">MuZero的版本、训练信息与泛化边界</text></a><text x="32" y="1190" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1214" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>