<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1232" viewBox="0 0 1100 1232" role="img" aria-label="具身、生态、生成与动力系统路线：分支与关系"><title>具身、生态、生成与动力系统路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">具身、生态、生成与动力系统路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>明确采用：作者明确借鉴Gibson的感知行动视角，同时承认他对Shannon式信息度量的反对；这是作者自述的借鉴与改造，不表示Gibson认可这一量化。</title><path d="M664 178H730V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="624.5" font-size="12" fill="#4b736d">R1</text></g><g><title>本站比较：本站比较感知运动历史与发展中成分协同的不同解释任务；没有据此认定直接继承或二者理论等同。</title><path d="M664 616H794V779H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="697.5" font-size="12" fill="#4b736d">R2</text></g><g><title>本站比较：发展理论与耦合系统形式分析共享对相互作用的关注；二者采用的对象、证据与发展时间尺度不同。此线为比较，不宣称历史影响。</title><path d="M664 762H858V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="843.5" font-size="12" fill="#4b736d">R3</text></g><g><title>直接回应：Beer直接回应包含Brooks与Kirsh在内的情境主体争论，将内部状态、纯反应性与表征分开；不把他概括的整个争论归结为Brooks一人的主张。</title><path d="M664 470H922V925H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="928" y="697.5" font-size="12" fill="#a44939">R4</text></g><a href="../atlas.html#e-gibson-1979" data-node="e-gibson-1979" aria-label="Gibson：环境为这个身体提供什么？"><title>知觉是否能直接发现相对于行动者的行动可能性？</title><rect x="34" y="130" width="630" height="112" rx="