<svg xmlns="http://www.w3.org/2000/svg" width="1174" height="1816" viewBox="0 0 1174 1816" role="img" aria-label="学习效率与泛化路线：分支与关系"><title>学习效率与泛化路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">学习效率与泛化路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>直接回应：直接点名并回应；同年往复，不推断明确先后顺序。</title><path d="M664 616H730V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="697.5" font-size="12" fill="#a44939">R1</text></g><g><title>直接批评：直接批评咖啡例及语境近似；关系图应允许同年双向争论。</title><path d="M664 762H794V633H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="697.5" font-size="12" fill="#a44939">R2</text></g><g><title>本站比较：比较同名术语的不同解释目标，不将词语相同当作思想继承。</title><path d="M664 324H858V633H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="478.5" font-size="12" fill="#4b736d">R3</text></g><g><title>转为评测问题：SCAN作者明确把隔离原语实验联系到Fodor等人的思想实验；这是特定模型与训练协议的操作化检验，不等于原架构论证的所有前提。</title><path d="M664 616H922V1217H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="928" y="916.5" font-size="12" fill="#4b736d">R4</text></g><g><title>实证回应：MLC直接回应系统性争论，提出经元训练获得组合能力的实例；同时明确未解决原论证的所有挑战，分布外结构和新符号仍有限制。</title><path d="M664 616H986V1655H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="992" y="1135.5" font-size="12" fill="#a44939">R5</text></g><g><title>本站比较：本站比较经验调整响应与学习隐藏表示；1986论文引用的是Rosenblatt专著，不能据此画成对1958论文的直接