<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="1524" viewBox="0 0 1238 1524" role="img" aria-label="符号、逻辑、搜索与组合路线：分支与关系"><title>符号、逻辑、搜索与组合路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">符号、逻辑、搜索与组合路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>直接回应：直接点名并回应；同年往复，不推断明确先后顺序。</title><path d="M664 908H730V1071H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="989.5" font-size="12" fill="#a44939">R1</text></g><g><title>直接批评：直接批评咖啡例及语境近似；关系图应允许同年双向争论。</title><path d="M664 1054H794V925H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="989.5" font-size="12" fill="#a44939">R2</text></g><g><title>本站比较：比较同名术语的不同解释目标，不将词语相同当作思想继承。</title><path d="M664 762H858V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="843.5" font-size="12" fill="#4b736d">R3</text></g><g><title>本站比较：比较相关前提选择与模型间搜索的不同处理；本条不宣称直接历史继承。</title><path d="M664 178H922V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="332.5" font-size="12" fill="#4b736d">R4</text></g><g><title>本站比较：比较手工启发式下界与学习得到的搜索分布；DreamCoder结果不能继承A*的路径最优性保证。</title><path d="M664 324H986V1363H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="843.5" font-size="12" fill="#4b736d">R5</text></g><g><title>直接回应：作者明确说明这项工作始于回应Fodor与Pylyshyn的表征挑战；1990是期刊节点，不表示研究直到该年才开始。</title><path d="M664 908H1050V1217H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="1056" y="1062.5" font-size="12" fill="#a44939">R6</text></g><g><title>明确采用：1990文章明确沿用BBS论文的理论立场并形式化结构表示问题；本边不宣称BBS是张量积方法的首次提出。</title><path d="M664 1054H1114V1217H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="1120" y="1135.5" font-size="12" fill="#4b736d">R7</text></g><a href="../atlas.html#e-mccarthy-1959" data-node="e-mccarthy-1959" aria-label="程序怎样通过接受陈述改变自己的行为？"><title>怎样把知识和启发式表达为系统可以推理的对象？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1959 · 常识形式化 · A批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">程序怎样通过接受陈述改变自己的行为？</text></a><a href="../atlas.html#e-hart-nilsson-raphael-1968" data-node="e-hart-nilsson-raphael-1968" aria-label="启发式知识怎样帮助搜索而保留最优解？"><title>怎样同时利用领域知识并约束搜索结果的路径代价？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1968 · 启发式图搜索 · A批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">启发式知识怎样帮助搜索而保留最优解？</text></a><a href="../atlas.html#e-strips-1971" data-node="e-strips-1971" aria-label="如何在世界模型之间搜索行动计划？"><title>怎样减少把整个行动序列都交给定理证明器造成的搜索困难？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1971 · 规划与行动模型 · A批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">如何在世界模型之间搜索行动计划？</text></a><a href="../atlas.html#e-newell-simon-1976" data-node="e-newell-simon-1976" aria-label="符号系统如何成为可检验的智能假说？"><title>哪些结构和过程可能支持一般智能行动，又应怎样检验？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">1976 · 符号系统与启发式搜索 · A批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">符号系统如何成为可检验的智能假说？</text></a><a href="../atlas.html#e-gentner-1983" data-node="e-gentner-1983" aria-label="类比为何偏向关系结构而非表面属性？"><title>当两个领域的对象不同，哪些知识仍可迁移？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">1983 · 类比与关系结构 · A批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">类比为何偏向关系结构而非表面属性？</text></a><a href="../atlas.html#e-fodor-pylyshyn-1988" data-node="e-fodor-pylyshyn-1988" aria-label="相关认知能力为什么成组出现？"><title>理解某种关系为什么通常伴随理解相关的角色交换，而不是互不相关的能力清单？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">1988 · 系统性争论 · A批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">相关认知能力为什么成组出现？</text></a><a href="../atlas.html#e-smolensky-1988-bbs" data-node="e-smolensky-1988-bbs" aria-label="分布式状态能否具有组成结构？"><title>连接主义是否只能把一个完整思想当成没有结构的原子？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">1988 · 分布式组成结构 · A批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">分布式状态能否具有组成结构？</text></a><a href="../atlas.html#e-smolensky-1990" data-node="e-smolensky-1990" aria-label="分布式向量怎样保存谁处于哪个角色？"><title>把多个对象的特征叠加以后，怎样保留对象与角色的绑定并取回它们？</title><rect x="34" y="1152" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1177" font-size="13" fill="#5c6e62">1990 · 角色绑定与结构表示 · A批审校节点</text><text x="52" y="1210" font-size="18" fill="#203d3a">分布式向量怎样保存谁处于哪个角色？</text></a><a href="../atlas.html#e-ellis-2021" data-node="e-ellis-2021" aria-label="能否同时学习程序库和搜索程序的方法？"><title>预先设计专用语言限制了程序合成，怎样从已解任务中学出可复用抽象？</title><rect x="34" y="1298" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1323" font-size="13" fill="#5c6e62">2021 · 程序归纳与学习搜索 · A批审校节点</text><text x="52" y="1356" font-size="18" fill="#203d3a">能否同时学习程序库和搜索程序的方法？</text></a><text x="32" y="1482" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1506" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>