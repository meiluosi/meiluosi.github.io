<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="1378" viewBox="0 0 1238 1378" role="img" aria-label="行为表现与操作性路线：分支与关系"><title>行为表现与操作性路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">行为表现与操作性路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>直接批评：Titchener直接讨论Watson的行为主义纲领；同时回应另一篇Image and Affection in Behavior，因此节点记录区分两篇的指涉。</title><path d="M664 178H730V341H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="259.5" font-size="12" fill="#a44939">R1</text></g><g><title>直接批评：Searle直接质疑测试表现对理解的充分性；不是证明图灵整套研究计划无效。</title><path d="M664 470H794V633H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="551.5" font-size="12" fill="#a44939">R2</text></g><g><title>概念比较（本站）：两者都重视公开可观察的表现，但对象、目的和协议不同；此边仅为本站比较，不主张思想继承。</title><path d="M664 178H858V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="332.5" font-size="12" fill="#4b736d">R3</text></g><g><title>概念比较（本站）：比较教育经历与技能获取问题；此边不主张两种形式化等同或直接继承。</title><path d="M664 470H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="697.5" font-size="12" fill="#4b736d">R4</text></g><g><title>方法比较（本站）：两者共同提示样本、运行和协议条件；任务与评测对象不同，不直接合并分数。</title><path d="M664 1054H986V1217H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="1135.5" font-size="12" fill="#4b736d">R5</text></g><g><title>直接回应：明确回应Searle；以功能表现为指标，未据此证明或否定理解。</title><path d="M664 616H1050V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="1056" y="697.5" font-size="12" fill="#a44939">R6</text></g><g><title>概念比较（本站）：对照跨环境成绩与技能获取效率；这是本站问题比较。</title><path d="M664 762H1114V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1120" y="843.5" font-size="12" fill="#4b736d">R7</text></g><a href="../atlas.html#e-watson-1913" data-node="e-watson-1913" aria-label="行为资料能否独立成为心理学的研究对象？"><title>研究行为的价值是否必须先由意识解释来证明？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1913 · 行为主义纲领 · B批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">行为资料能否独立成为心理学的研究对象？</text></a><a href="../atlas.html#e-titchener-1914" data-node="e-titchener-1914" aria-label="改变研究立场能否取消原来的心理学问题？"><title>行为研究完成后，经验与意识问题是否因此被解决？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1914 · 行为主义的直接批评 · B批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">改变研究立场能否取消原来的心理学问题？</text></a><a href="../atlas.html#e-turing-1950" data-node="e-turing-1950" aria-label="以模仿游戏重述机器思考问题"><title>怎样把“机器能否思考”改写为可讨论、可实施的比较？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1950 · 操作化与学习经历 · B批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">以模仿游戏重述机器思考问题</text></a><a href="../atlas.html#e-searle-1980" data-node="e-searle-1980" aria-label="中文房间：表现足以证明理解吗？"><title>回答与母语者无法区分，是否足以推出系统理解了内容？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">1980 · 评价解释的充分性 · B批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">中文房间：表现足以证明理解吗？</text></a><a href="../atlas.html#e-legg-hutter-2007" data-node="e-legg-hutter-2007" aria-label="跨环境的通用智能度量"><title>怎样将不同环境的目标达成汇总成一个形式指标？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2007 · 从单项表现到加权环境类 · B批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">跨环境的通用智能度量</text></a><a href="../atlas.html#e-chollet-2019" data-node="e-chollet-2019" aria-label="把技能成绩与技能获取效率分开"><title>高分来自获取新技能的能力，还是已注入的知识与经验？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2019 · 泛化、先验与经验 · B批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">把技能成绩与技能获取效率分开</text></a><a href="../atlas.html#e-agarwal-2021" data-node="e-agarwal-2021" aria-label="有限重复次数下的评价不确定性"><title>少量随机运行得到的领先分数，能否稳定支持算法优劣判断？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">2021 · 从点分数到分布和区间 · B批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">有限重复次数下的评价不确定性</text></a><a href="../atlas.html#e-helm-2022" data-node="e-helm-2022" aria-label="HELM：场景与多指标共同构成评价"><title>如何展示不同用途下的表现取舍，并明确没有测到什么？</title><rect x="34" y="1152" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1177" font-size="13" fill="#5c6e62">2022 · 覆盖范围与协议可比性 · B批审校节点</text><text x="52" y="1210" font-size="18" fill="#203d3a">HELM：场景与多指标共同构成评价</text></a><text x="32" y="1336" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1360" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>