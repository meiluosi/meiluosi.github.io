<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1232" viewBox="0 0 1110 1232" role="img" aria-label="神经科学路线：分支与关系"><title>神经科学路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">神经科学路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>方法比较（本站）：本站比较可塑性假设与局部实验，不据此宣称已核实二者历史传承或完整记忆机制。</title><path d="M664 178H730V341H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="259.5" font-size="12" fill="#4b736d">R1</text></g><g><title>明确采用：损伤研究明确把P-FIT的分布网络主张列为检验背景。</title><path d="M664 470H794V633H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="551.5" font-size="12" fill="#4b736d">R2</text></g><g><title>方法比较（本站）：比较损伤证据的解释范围；不是Jonas对这篇特定脑损伤论文的直接反驳。</title><path d="M664 616H858V779H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="864" y="697.5" font-size="12" fill="#4b736d">R3</text></g><g><title>概念比较（本站）：比较局部网络整合与系统动态重组，未将后者写成前者被推翻。</title><path d="M664 470H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="697.5" font-size="12" fill="#4b736d">R4</text></g><g><title>方法比较（本站）：结构资料、跨脑验证与机制解释承担不同任务。</title><path d="M664 762H986V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="916.5" font-size="12" fill="#4b736d">R5</text></g><a href="../atlas.html#e-hebb-1949" data-node="e-hebb-