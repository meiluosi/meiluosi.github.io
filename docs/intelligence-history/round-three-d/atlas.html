思调整之间的关系应怎样研究？","evidence":{"kind":"哲学寓言","unit":"行动者与情境","observation":"文本论证，无实验验证。","discriminator":"作为问题来源比较自动化与困难情境调整；经验检验须另设。"}},{"id":"e-sternberg-1998","year":1998,"dateLabel":"1998","routeIds":["wisdom-values"],"sourceIds":["sternberg-1998","sternberg-current"],"branch":"平衡理论","title":"智慧把能力指向共同善","status":"claims-reviewed","question":"追求个人成功的能力如何与智慧区别？","mechanism":"以价值调节默会知识，在个人、人际、超个人利益及适应、塑造、选择环境间平衡。","assumptions":"共同善是规范承诺，需说明如何协商与辨认。","claims":[{"id":"e-sternberg-1998-dc1","sourceId":"sternberg-1998","text":"1998摘要把智慧定义为价值中介的默会知识应用，目标为共同善并协调多类利益。","locator":"1998摘要","basis":"source-reported","independentlyReplicated":false},{"id":"e-sternberg-1998-dc2","sourceId":"sternberg-current","text":"作者当前网页说明平衡不等于等权，并承认共同善没有显然且公认的定义。","locator":"当前作者网页第Third段","basis":"source-reported","independentlyReplicated":false}],"limits":["正文未读；当前作者网站的新表述不能倒记成1998原句。"],"nextQuestion":"“共同善”的判断应由哪些受影响者参与？","evidence":{"kind":"规范性心理理论（仅原摘要）","unit":"价值判断与行动选择","observation":"理论定义，不是所有社会已达共识。","discriminator":"公开利益冲突、时间尺度与权重理由，再看判断是否一致。"},"baselineEventId":"e-sternberg-1998"},{"id":"e-baltes-staudinger-2000","year":2000,"dateLabel":"2000","routeIds":["wisdom-values"],"sourceIds":["baltes-staudinger-2000"],"branch":"柏林智慧范式","title":"把生活判断转成评分协议","status":"claims-reviewed","question":"如何观察智慧相关知识而不只依赖声望？","mechanism":"以生活困境的出声思考记录，按事实知识、程序知识、生命周期情境、价值相对性、不确定性评分。","assumptions":"训练评分者能可靠应用这些具有理论承诺的标准。","claims":[{"id":"e-baltes-staudinger-2000-dc1","sourceId":"baltes-staudinger-2000","text":"范式提出五类标准，并以虚构人物生活难题的出声思考文本评定。","locator":"p125–126","basis":"source-reported","independentlyReplicated":false},{"id":"e-baltes-staudinger-2000-dc2","sourceId":"baltes-staudinger-2000","text":"价值相对性不意味着完全相对主义，作者仍保留德性与共同善的要求。","locator":"p126开头","basis":"source-reported","independentlyReplicated":false}],"limits":["评分可靠不自动保证跨文化构念等价或规范正确。"],"nextQuestion":"语言表达和评分文化会如何影响智慧表现？","evidence":{"kind":"心理测量框架","unit":"生活判断文本及评分者","observation":"所读为测量协议；未复核报告效度。","discriminator":"匹配表达资源，交叉文化盲评并检查评分不变性。"},"baselineEventId":"e-baltes-staudinger-2000"},{"id":"e-grossmann-2012","year":2012,"dateLabel":"2012","routeIds":["wisdom-values"],"sourceIds":["grossmann-2012"],"branch":"跨文化操作化","title":"智慧表现中的年龄与文化","status":"claims-reviewed","question":"智慧是否随年龄按同一路径增长？","mechanism":"比较东京与美国密歇根样本对人际和群际冲突的推理，进行六维编码。","assumptions":"样本、翻译、情境及编码规则限定外推。","claims":[{"id":"e-grossmann-2012-dc1","sourceId":"grossmann-2012","text":"作者报告年龄与智慧推理的关系在所采美日样本中不同，且随冲突领域变化。","locator":"稿p2；p11–12","basis":"source-reported","independentlyReplicated":false},{"id":"e-grossmann-2012-dc2","sourceId":"grossmann-2012","text":"作者明确要求纵向、更多文化及机制实验，并质疑显性冲突解决是否普适标准。","locator":"稿p11–13","basis":"source-reported","independentlyReplicated":false}],"limits":["横断面不等于同一个人随年龄变化；不能据样本差异概括所有文化成员。"],"nextQuestion":"哪些维度具有跨语境稳定性，哪些依赖价值与任务？","evidence":{"kind":"跨文化横断面研究","unit":"两个地区的年龄分层样本与推理文本","observation":"作者报告；未做纵向或数据复算。","discriminator":"纵向设计、双向翻译和交叉评分，分离队列、教育与情境。"}}]},"routeRelations":{"sociocultural-language":[{"id":"d-r01","fromId":"e-vygotsky-1934","toId":"e-tomasello-2005","type":"explicit-adoption","status":"source-supported","evidenceSourceIds":["tomasello-2005"],"locator":"p689","explanation":"Tomasello明确使用Vygotskian内化解释的措辞，同时承认具体机制未明。"},{"id":"d-r02","fromId":"e-senghas-2004","toId":"e-mesoudi-2018","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["senghas-2004","mesoudi-2018"],"locator":"p1781；p2–3","explanation":"本站比较结构重组与累积判据，不宣称后文继承此实验。"},{"id":"d-r03","fromId":"e-henrich-2004","toId":"e-andersson-read-2014","type":"direct-critique","status":"source-supported","evidenceSourceIds":["andersson-read-2014"],"locator":"E1首段；E2回复","explanation":"往来争论明确追溯人口规模假说，但主要实证靶标是Derex实验。"},{"id":"d-r04","fromId":"e-derex-2013","toId":"e-andersson-read-2014","type":"direct-critique","status":"source-supported","evidenceSourceIds":["andersson-read-2014"],"locator":"E1–E2","explanation":"同一节点记录原论文遭批评及作者回复，保留分析单位争议。"},{"id":"d-r05","fromId":"e-tomasello-2005","toId":"e-mesoudi-2018","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["tomasello-2005","mesoudi-2018"],"locator":"p676；p2–3","explanation":"共享意向的机制假说不能代替累积文化的结果判据。"}],"collective-extended":[{"id":"d-r06","fromId":"e-hayek-1945","toId":"e-hutchins-cockpit-1995","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["hayek-1945","hutchins-cockpit-1995"],"locator":"§I–III；稿p2–3","explanation":"二者都扩展个体之外的分析，任务与机制不同，未主张思想影响。"},{"id":"d-r07","fromId":"e-clark-chalmers-1998","toId":"e-adams-aizawa-2001","type":"direct-critique","status":"source-supported","evidenceSourceIds":["adams-aizawa-2001"],"locator":"刊p43、47","explanation":"作者明确批评延展心智对工具使用的构成解释。"},{"id":"d-r08","fromId":"e-adams-aizawa-2001","toId":"e-clark-reply-2010","type":"direct-response","status":"source-supported","evidenceSourceIds":["clark-reply-2010"],"locator":"2006稿p6–7及标题","explanation":"回复针对Adams与Aizawa系列论文；不限定为逐条回应2001版。"},{"id":"d-r09","fromId":"e-hutchins-cockpit-1995","toId":"e-clark-chalmers-1998","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["hutchins-cockpit-1995","clark-chalmers-1998"],"locator":"稿p20；Otto条件段","explanation":"系统分析单位与心智构成论题分别成立，不能相互替证。"},{"id":"d-r10","fromId":"e-woolley-2010","toId":"e-bates-gupta-2017","type":"direct-critique","status":"source-supported","evidenceSourceIds":["bates-gupta-2017"],"locator":"稿PDF15–16","explanation":"复核对群体因素来源提出竞争模型；本批未重算。"},{"id":"d-r11","fromId":"e-woolley-2010","toId":"e-lorenz-2011","type":"method-comparison","status":"editorial-inference","evidenceSourceIds":["woolley-2010","lorenz-2011"],"locator":"p688；PDF1、5","explanation":"跨任务群体因素与数值估计聚合是不同对象。"}],"wisdom-values":[{"id":"d-r12","fromId":"e-aristotle-ethics","toId":"e-sternberg-1998","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["aristotle-ethics","sternberg-1998"],"locator":"VI.5；摘要","explanation":"仅比较目的审议与共同善，不推断直接传承。"},{"id":"d-r13","fromId":"e-mengzi-jinxin","toId":"e-zh 18\" font-size=\"18\" fill=\"#203d3a\">把生活判断转成评分协议\u003c/text>\u003c/a>\u003ca href=\"#e-grossmann-2012\" data-node=\"e-grossmann-2012\" aria-label=\"智慧表现中的年龄与文化\">\u003ctitle>智慧是否随年龄按同一路径增长？\u003c/title>\u003crect x=\"34\" y=\"1006\" width=\"630\" height=\"112\" rx=\"10\" fill=\"#fff\" stroke=\"#9bae9e\"/>\u003ctext x=\"52\" y=\"1031\" font-size=\"13\" fill=\"#5c6e62\">2012 · 跨文化操作化 · D批审校节点\u003c/text>\u003ctext x=\"52\" y=\"1064\" font-size=\"18\" fill=\"#203d3a\">智慧表现中的年龄与文化\u003c/text>\u003c/a>\u003ctext x=\"32\" y=\"1190\" font-size=\"13\" fill=\"#203d3a\">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。\u003c/text>\u003ctext x=\"32\" y=\"1214\" font-size=\"13\" fill=\"#203d3a\">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。\u003c/text>\u003c/svg>"}},"relationLabels":{"conceptual-comparison":"概念比较（本站）","method-comparison":"方法比较（本站）","architecture-comparison":"架构比较","direct-critique":"直接批评","direct-response":"直接回应","editorial-comparison":"本站比较","empirical-response":"实证回应","explicit-adoption":"明确采用","motivated-evaluation":"转为评测问题"}};
const byId=new Map(data.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let mode="timeline",selected=null;
const requested=new URLSearchParams(location.search).get("route");
if(data.routes.some(r=>r.id===requested))$("route").value=requested;
function noteHref(n){return (n.previousRound?"../round-two/notes/":"notes/")+n.id+".md";}
function renderRoute(){
 const rid=$("route").value,route=data.routes.find(r=>r.id===rid),list=data.routeNodes[rid],edges=data.routeRelations[rid];
 $("route-narrative").innerHTML=route.narrative.map(p=>"<p>"+esc(p)+"</p>").join("");
 $("route-status").textContent="本批节点 "+list.filter(n=>!n.previousRound).length+" · 已完成本批指定范围验收";
 $("figure").innerHTML=data.figures[rid][mode];
 $("directory").innerHTML=list.map(n=>'<button type="button" data-node="'+n.id+'" aria-pressed="'+(n.id===selected)+'">'+esc(n.dateLabel+" · "+n.title)+'</button>').join("");
 $("svg-link").href="routes/"+rid+"-"+mode+".svg";$("mmd-link").href="routes/"+rid+"-"+mode+".mmd";
 ["timeline","relations"].forEach(m=>$(m).setAttribute("aria-pressed",String(m===mode)));
 $("edge-table").innerHTML=edges.length?'<table><thead><tr><th>编号／关系</th><th>说明与证据</th></tr></thead><tbody>'+edges.map((e,i)=>'<tr><td>R'+(i+1)+' · '+esc(data.relationLabels[e.type]||e.type)+'</td><td>'+esc(byId.get(e.fromId).title)+" → "+esc(byId.get(e.toId).title)+'<br>'+esc(e.explanation)+'<br><span class="muted">'+esc(e.locator)+'</span></td></tr>').join("")+'</tbody></table>':'<p class="muted">本批尚未确认本路线内部的关系边。</p>';
}
function show(id){
 const n=byId.get(id);if(!n)return;
 const rid=$("route").value;
 if(!data.routeNodes[rid].some(x=>x.id===id))$("route").value=data.routes.find(r=>data.routeNodes[r.id].some(x=>x.id===id)).id;
 selected=id;renderRoute();
 const label=n.previousRound?"第二轮延续记录":"本批指定主张审校";
 let h='<p class="label">'+esc(n.dateLabel+" · "+label)+'</p><h2>'+esc(n.title)+'</h2>';
 for(const [key,title] of [["question","探究的问题"],["mechanism","方法与机制"],["assumptions","成立条件"],["limits","证据边界"],["nextQuestion","下一问"]])h+='<h3>'+title+'</h3><p>'+esc(n[key])+'</p>';
 if(n.evidence){h+='<h3>证据标准</h3><div class="table-scroll"><table><tbody>';for(const [key,title] of [["kind","证据性质"],["unit","分析单位"],["observation","观察／论证依据"],["discriminator","需要区分的解释"]])h+='<tr><th>'+title+'</th><td>'+esc(n.evidence[key])+'</td></tr>';h+='</tbody></table></div>';}
 h+='<h3>主张与原文定位</h3>' +n.claims.map(c=>{const s=n.sources.find(s=>s.id===c.sourceId)||n.sources[0];const kind=({'source-reported':'原文主张','derived':'本次推导或验证','editorial-inference':'本站分析'})[c.basis]||c.basis;return '<div class="evidence"><p class="label">'+esc(kind)+'</p><p>'+esc(c.text)+'</p><p class="label"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a> · '+esc(c.locator)+' · '+(c.independentlyReplicated?'已验证所列范围，详见复现报告':'未独立复现')+'</p></div>';}).join("");
 h+='<details open><summary>阅读范围与来源版本</summary>'+n.sources.map(s=>'<div class="evidence"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a><p>'+esc(s.version)+'</p><p><strong>已读：</strong>'+esc(s.readScope)+'</p><p><strong>未覆盖：</strong>'+esc(s.unreadScope||'其余证明、附录或实验未全面验证，完整记录见第二轮笔记。')+'</p><p class="label">'+(s.sha256?'载体指纹已保存于笔记'+(s.fingerprintScope?'；指纹范围：'+esc(s.fingerprintScope):''):'经网页正文或转录阅读，无本地载体指纹')+'</p></div>').join("")+'</details>';
 h+='<p><a href="'+noteHref(n)+'">完整笔记</a> · <a href="research.json">可编辑研究数据</a></p>';

 if(n.versionComparisonId)h+='<p><a href="versions/'+esc(n.versionComparisonId)+'.md">版本对照与未覆盖范围</a></p>';
 $("detail").innerHTML=h;
}
function choose(id){show(id);const u=new URL(location.href);u.searchParams.set("route",$("route").value);u.hash=id;history.replaceState(null,"",u);}
$("route").addEventListener("change",()=>choose(data.routeNodes[$("route").value][0].id));
["timeline","relations"].forEach(m=>$(m).addEventListener("click",()=>{mode=m;renderRoute();}));
for(const id of ["directory","figure"])$(id).addEventListener("click",e=>{const a=e.target.closest("[data-node]");if(a){e.preventDefault();choose(a.dataset.node);}});
addEventListener("hashchange",()=>show(decodeURIComponent(location.hash.slice(1))));
const initial=decodeURIComponent(location.hash.slice(1));show(byId.has(initial)?initial:data.routeNodes[$("route").value][0].id);
