<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1232" viewBox="0 0 1110 1232" role="img" aria-label="社会文化与语言：分支与关系"><title>社会文化与语言：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">社会文化与语言 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>明确采用：Tomasello明确使用Vygotskian内化解释的措辞，同时承认具体机制未明。</title><path d="M664 178H730V633H668" fill="none" stroke="#4b736d" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="736" y="405.5" font-size="12" fill="#4b736d">R1</text></g><g><title>概念比较（本站）：本站比较结构重组与累积判据，不宣称后文继承此实验。</title><path d="M664 470H794V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="770.5" font-size="12" fill="#4b736d">R2</text></g><g><title>直接批评：往来争论明确追溯人口规模假说，但主要实证靶标是Derex实验。</title><path d="M664 324H858V925H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="624.5" font-size="12" fill="#a44939">R3</text></g><g><title>直接批评：同一节点记录原论文遭批评及作者回复，保留分析单位争议。</title><path d="M664 762H922V925H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="928" y="843.5" font-size="12" fill="#a44939">R4</text></g><g><title>概念比较（本站）：共享意向的机制假说不能代替累积文化的结果判据。</title><path d="M664 616H986V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="843.5" font-size="12" fill="#4b736d">R5</text></g><a href="../atlas.html#e-vygotsky-1934" data-node="e-vygotsky-1934" aria-label="词义成为发展的分析单位"><title>如