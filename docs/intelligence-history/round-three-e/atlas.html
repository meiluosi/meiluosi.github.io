ported","independentlyReplicated":false}],"limits":["这是多层假说，不是意识量子起源已证实；量子计算也不能不经论证等同超图灵计算。"],"nextQuestion":"在生理条件下，模型要求的自由度、相干时间和因果作用能否被测到？","evidence":{"kind":"物理与生物机制假说","unit":"微管构象及还原事件","observation":"原文假设与结论选读","discriminator":"物理可行性、神经作用与体验映射"},"baselineEventId":"e-hameroff-penrose-1996"},{"id":"e-tegmark-2000","year":2000,"dateLabel":"2000","routeIds":["metaphysics-quantum"],"sourceIds":["tegmark-2000"],"branch":"物理可行性异议","title":"退相干时间：把物理主张变为数量级约束","status":"claims-reviewed","question":"假定的脑内量子态能否保持足够久以参与认知？","mechanism":"估算神经放电及微管极化激发的环境退相干时间。","assumptions":"结果依赖所选自由度、叠加分离与环境耦合模型。","claims":[{"id":"e-tegmark-2000-ec1","sourceId":"tegmark-2000","text":"摘要估计约10^-13至10^-20秒的退相干时间，并与约10^-3至10^-1秒动力学尺度比较。","locator":"PDF 1摘要","basis":"source-reported","independentlyReplicated":false},{"id":"e-tegmark-2000-ec2","sourceId":"tegmark-2000","text":"研究聚焦模型中相关自由度的相干存续，结论反对其具有认知尺度的相干作用。","locator":"PDF 1 Introduction；7结果汇总","basis":"source-reported","independentlyReplicated":false}],"limits":["不是所有量子生物效应不存在的证明；争论必须检查是否计算了对方实际主张的状态。"],"nextQuestion":"改变被建模自由度和环境参数后，数量级结论有多稳健？","evidence":{"kind":"条件化物理计算","unit":"神经与微管模型自由度","observation":"估计结果选读；未重算","discriminator":"模型对象一致性与时间尺度"},"baselineEventId":"e-tegmark-2000"},{"id":"e-hagan-2002","year":2002,"dateLabel":"2002","routeIds":["metaphysics-quantum"],"sourceIds":["hagan-2002"],"branch":"物理争论回应","title":"回应退相干批评：先对齐模型与参数","status":"claims-reviewed","question":"Tegmark估计是否对应Orch OR的实际假设？","mechanism":"质疑孤子与构象模型错位，并改变分离尺度、电荷／偶极与介电条件。","assumptions":"更长时间是替代假设下的计算主张；主动维持与屏蔽条件还需实验依据。","claims":[{"id":"e-hagan-2002-ec1","sourceId":"hagan-2002","text":"作者认为Tegmark的微管模型与其构象叠加模型不同，并列出参数修订理由。","locator":"PDF 1摘要，条目1–3","basis":"source-reported","independentlyReplicated":false},{"id":"e-hagan-2002-ec2","sourceId":"hagan-2002","text":"摘要给出修订后约10^-5至10^-4秒，并在额外环境假设下提出更长时间；这些不是活脑直接测量值。","locator":"PDF 1摘要，条目3–5","basis":"source-reported","independentlyReplicated":false}],"limits":["本批读的是2000预印本；反驳一组参数不自动证明相干存在，更不证明其构成意识。"],"nextQuestion":"哪些关键参数已有独立测量，哪些仍是维持模型的假设？","evidence":{"kind":"对计算模型的直接回应","unit":"微管态与环境参数","observation":"预印本主张选读","discriminator":"修改模型的可能性与真实生物实现"}},{"id":"e-strawson-2006","year":2006,"dateLabel":"2006","routeIds":["metaphysics-quantum"],"sourceIds":["strawson-2006"],"branch":"体验的本体论","title":"真实物理主义与微观经验前提","status":"claims-reviewed","question":"承认体验真实，又拒绝从全无体验到体验的强涌现，会得到什么？","mechanism":"从体验实在、物理主义和反强涌现前提出发，论证至少部分基本存在有经验面向。","assumptions":"关键依赖拒绝彻底非经验基础产生经验；并非仅由现有物理定律推出。","claims":[{"id":"e-strawson-2006-ec1","sourceId":"strawson-2006","text":"作者将承认经验真实性作为其“真实物理主义”的起点，并区分它与把物理学词汇当全部现实描述的立场。","locator":"PDF 1，§1","basis":"source-reported","independentlyReplicated":false},{"id":"e-strawson-2006-ec2","sourceId":"strawson-2006","text":"§5先推出至少部分基本实体涉及经验的micropsychism，再讨论更广泛的panpsychism。","locator":"PDF 16，§5","basis":"source-reported","independentlyReplicated":false}],"limits":["这是形而上学论证，没有提供微观经验的直接测量；更不推出电子具有人的认知或智慧。"],"nextQuestion":"微观经验怎样构成统一主体，是否有可区分的经验后果？","evidence":{"kind":"形而上学论证","unit":"经验与基本存在","observation":"前提及结论选读","discriminator":"本体承诺、组合问题与实证预测"}},{"id":"e-wang-quantum-2014","year":2014,"dateLabel":"2014","routeIds":["metaphysics-quantum"],"sourceIds":["wang-quantum-2014"],"branch":"量子概率模型","title":"量子认知：顺序效应的概率结构","status":"claims-reviewed","question":"提问顺序如何系统性改变判断分布？","mechanism":"使用不对易的测量概率结构，提出并检验QQ等式。","assumptions":"具体预测有适用条件；问法改变认知状态，不必等同固定变量的静态联合分布。","claims":[{"id":"e-wang-quantum-2014-ec1","sourceId":"wang-quantum-2014","text":"作者报告70组全国调查和2项实验支持预先提出的QQ等式。","locator":"PDF 1摘要","basis":"source-reported","independentlyReplicated":false},{"id":"e-wang-quantum-2014-ec2","sourceId":"wang-quantum-2014","text":"讨论明确允许经典神经过程产生可由量子概率更好描述的行为，未据此断定脑内量子物理机制。","locator":"PDF 6 Discussion末段","basis":"source-reported","independentlyReplicated":false}],"limits":["行为拟合或顺序效应本身不识别物理实现；本批经典状态机反例只覆盖预定的两次测量例。"],"nextQuestion":"与具有状态更新的经典模型相比，何种新预测和模型约束能真正区分方案？","evidence":{"kind":"概率模型及作者行为研究","unit":"问题顺序与回答分布","observation":"摘要与物理解释限制选读","discriminator":"量子概率形式与量子物理实现"}}]},"routeRelations":{"information-physics":[{"id":"e-r01","fromId":"e-shannon-1948","toId":"e-tishby-1999","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["shannon-1948","tishby-1999"],"locator":"Shannon导论／§6；Tishby §3","explanation":"通信不确定性与相对Y的任务相关性分开；不是同一“信息”定义自然升级。"},{"id":"e-r02","fromId":"e-solomonoff-1964","toId":"e-tishby-1999","type":"method-comparison","status":"editorial-inference","evidenceSourceIds":["solomonoff-1964","tishby-1999"],"locator":"Solomonoff摘要；Tishby式15","explanation":"比较描述先验与给定Y的压缩目标，不宣称直接继承。"},{"id":"e-r03","fromId":"e-beggs-plenz-2003","toId":"e-touboul-destexhe-2010","type":"direct-critique","status":"source-supported","evidenceSourceIds":["touboul-destexhe-2010"],"locator":"PDF 1、13 Discussion","explanation":"后者挑战幂律足以支持临界性的推断；其猫记录与前者切片不同，不能称原样重复。"},{"id":"e-r04","fromId":"e-beggs-plenz-2003","toId":"e-wissner-gross-2013","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["beggs-plenz-2003","wissner-gross-2013"],"locator":"Beggs Discussion；Wissner接受稿PDF 5","explanation":"比较统计动力学与适应行为生成；两者都不直接给出通用智能定义。"}],"philosophy-of-mind":[{"id":"e-r05","fromId":"e-putnam-1967","toId":"e-dennett-1981","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["putnam-1967","dennett-1981"],"locator":"Putnam PDF 4、6；Dennett印刷557–558","explanation":"功能组织说明与意向预测立场的对象不同，不能用术语相近代替思想继承证据。"},{"id":"e-r06","fromId":"e-searle-1980","toId":"e-hofstadter-1980","type":"direct-critique","status":"source-supported","evidenceSourceIds":["hofstadter-1980"],"locator":"433–434，PDF 17–18","explanation":"同时期评论直接批评中文房间的尺度、复杂度与系统层次直觉；箭头表示被批评对象到评论。"},{"id":"e-r07","fromId":"e-searle-1980","toId":"e-harnad-1990","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["searle-1980","harnad-1990"],"locator":"Searle 419、422–424；Harnad §5","explanation":"接地要求增加行为与世界约束，但Harnad明说仍不保证主观意义；不是宣布中文房间已被解决。"},{"id":"e-r08","fromId":"e-harnad-1990","toId":"e- -1961","toId":"e-hameroff-penrose-1996","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["lucas-1961","hameroff-penrose-1996"],"locator":"Lucas 120–121；Hameroff-Penrose摘要","explanation":"逻辑限制与物理机制是两层论证；前者不能单独推出特定微管机制。"},{"id":"e-r17","fromId":"e-hameroff-penrose-1996","toId":"e-tegmark-2000","type":"direct-critique","status":"source-supported","evidenceSourceIds":["tegmark-2000"],"locator":"PDF 1 Introduction","explanation":"退相干计算针对脑内认知尺度相干假说；是否对齐原模型又受到下一节点质疑。"},{"id":"e-r18","fromId":"e-tegmark-2000","toId":"e-hagan-2002","type":"direct-response","status":"source-supported","evidenceSourceIds":["hagan-2002"],"locator":"PDF 1摘要条目1–5","explanation":"回应认为模型自由度与参数需修订，提出更长时间估计；没有完成独立生理验证。"},{"id":"e-r19","fromId":"e-hameroff-penrose-1996","toId":"e-wang-quantum-2014","type":"conceptual-comparison","status":"editorial-inference","evidenceSourceIds":["hameroff-penrose-1996","wang-quantum-2014"],"locator":"前者摘要；后者PDF 6 Discussion","explanation":"具体量子物理机制与量子概率描述分开；后者明说经典脑也可能呈现相关行为结构。"}]},"figures":{"information-physics":{"timeline":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"804\" viewBox=\"0 0 1400 804\" role=\"img\" aria-label=\"信息、压缩、复杂系统与物理路线：E批时间线\">\u003ctitle>信息、压缩、复杂系统与物理路线：E批时间线\u003c/title>\u003cstyle>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}\u003c/style>\u003crect width=\"100%\" height=\"100%\" fill=\"#faf9f4\"/>\u003ctext x=\"32\" y=\"43\" font-size=\"26\" fill=\"#203d3a\">信息、压缩、复杂系统与物理路线\u003c/text>\u003ctext x=\"32\" y=\"78\" font-size=\"15\" fill=\"#203d3a\">现代共同等比例轴 · 古典文本独立标识 · 纵向不表示因果\u003c/text>\u003cpath d=\"M690 114V760\" stroke=\"#d6ded8\"/>\u003ctext x=\"690\" y=\"106\" font-size=\"13\" text-anchor=\"middle\" fill=\"#58695f\">1940\u003c/text>\u003cpath d=\"M757.7777777777778 114V760\" stroke=\"#d6ded8\"/>\u003ctext x=\"757.7777777777778\" y=\"106\" font-size=\"13\" text-an ponse":"实证回应","explicit-adoption":"明确采用","motivated-evaluation":"转为评测问题"}};
const byId=new Map(data.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let mode="timeline",selected=null;
const requested=new URLSearchParams(location.search).get("route");
if(data.routes.some(r=>r.id===requested))$("route").value=requested;
function noteHref(n){return (n.previousRound?"../round-two/notes/":"notes/")+n.id+".md";}
function renderRoute(){
 const rid=$("route").value,route=data.routes.find(r=>r.id===rid),list=data.routeNodes[rid],edges=data.routeRelations[rid];
 $("route-narrative").innerHTML=route.narrative.map(p=>"<p>"+esc(p)+"</p>").join("");
 $("route-status").textContent="本批节点 "+list.filter(n=>!n.previousRound).length+" · 已完成本批指定范围验收";
 $("figure").innerHTML=data.figures[rid][mode];
 $("directory").innerHTML=list.map(n=>'<button type="button" data-node="'+n.id+'" aria-pressed="'+(n.id===selected)+'">'+esc(n.dateLabel+" · "+n.title)+'</button>').join("");
 $("svg-link").href="routes/"+rid+"-"+mode+".svg";$("mmd-link").href="routes/"+rid+"-"+mode+".mmd";
 ["timeline","relations"].forEach(m=>$(m).setAttribute("aria-pressed",String(m===mode)));
 $("edge-table").innerHTML=edges.length?'<table><thead><tr><th>编号／关系</th><th>说明与证据</th></tr></thead><tbody>'+edges.map((e,i)=>'<tr><td>R'+(i+1)+' · '+esc(data.relationLabels[e.type]||e.type)+'</td><td>'+esc(byId.get(e.fromId).title)+" → "+esc(byId.get(e.toId).title)+'<br>'+esc(e.explanation)+'<br><span class="muted">'+esc(e.locator)+'</span></td></tr>').join("")+'</tbody></table>':'<p class="muted">本批尚未确认本路线内部的关系边。</p>';
}
function show(id){
 const n=byId.get(id);if(!n)return;
 const rid=$("route").value;
 if(!data.routeNodes[rid].some(x=>x.id===id))$("route").value=data.routes.find(r=>data.routeNodes[r.id].some(x=>x.id===id)).id;
 selected=id;renderRoute();
 const label=n.previousRound?"第二轮延续记录":"本批指定主张审校";
 let h='<p class="label">'+esc(n.dateLabel+" · "+label)+'</p><h2>'+esc(n.title)+'</h2>';
 for(const [key,title] of [["question","探究的问题"],["mechanism","方法与机制"],["assumptions","成立条件"],["limits","证据边界"],["nextQuestion","下一问"]])h+='<h3>'+title+'</h3><p>'+esc(n[key])+'</p>';
 if(n.evidence){h+='<h3>证据标准</h3><div class="table-scroll"><table><tbody>';for(const [key,title] of [["kind","证据性质"],["unit","分析单位"],["observation","观察／论证依据"],["discriminator","需要区分的解释"]])h+='<tr><th>'+title+'</th><td>'+esc(n.evidence[key])+'</td></tr>';h+='</tbody></table></div>';}
 h+='<h3>主张与原文定位</h3>' +n.claims.map(c=>{const s=n.sources.find(s=>s.id===c.sourceId)||n.sources[0];const kind=({'source-reported':'原文主张','derived':'本次推导或验证','editorial-inference':'本站分析'})[c.basis]||c.basis;return '<div class="evidence"><p class="label">'+esc(kind)+'</p><p>'+esc(c.text)+'</p><p class="label"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a> · '+esc(c.locator)+' · '+(c.independentlyReplicated?'已验证所列范围，详见复现报告':'未独立复现')+'</p></div>';}).join("");
 h+='<details open><summary>阅读范围与来源版本</summary>'+n.sources.map(s=>'<div class="evidence"><a href="'+esc(s.url)+'">'+esc(s.title||s.version)+'</a><p>'+esc(s.version)+'</p><p><strong>已读：</strong>'+esc(s.readScope)+'</p><p><strong>未覆盖：</strong>'+esc(s.unreadScope||'其余证明、附录或实验未全面验证，完整记录见第二轮笔记。')+'</p><p class="label">'+(s.sha256?'载体指纹已保存于笔记'+(s.fingerprintScope?'；指纹范围：'+esc(s.fingerprintScope):''):'经网页正文或转录阅读，无本地载体指纹')+'</p></div>').join("")+'</details>';
 h+='<p><a href="'+noteHref(n)+'">完整笔记</a> · <a href="research.json">可编辑研究数据</a></p>';

 if(n.versionComparisonId)h+='<p><a href="versions/'+esc(n.versionComparisonId)+'.md">版本对照与未覆盖范围</a></p>';
 $("detail").innerHTML=h;
}
function choose(id){show(id);const u=new URL(location.href);u.searchParams.set("route",$("route").value);u.hash=id;history.replaceState(null,"",u);}
