<svg xmlns="http://www.w3.org/2000/svg" width="1174" height="1232" viewBox="0 0 1174 1232" role="img" aria-label="意识、情感与自我路线：分支与关系"><title>意识、情感与自我路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">意识、情感与自我路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>概念比较（本站）：体验解释要求与因果整合的理论对应关系需分别论证，不因共同谈意识而同义。</title><path d="M664 178H730V633H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="405.5" font-size="12" fill="#4b736d">R1</text></g><g><title>概念比较（本站）：比较“为什么有体验”与“系统为什么归因自己有觉知”，保留解释目标的分歧。</title><path d="M664 178H794V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="551.5" font-size="12" fill="#4b736d">R2</text></g><g><title>直接批评：后者直接质疑原知识探测方法，并限制其“意识之前”解释；不否认一切无意识或情感影响。</title><path d="M664 324H858V487H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="405.5" font-size="12" fill="#a44939">R3</text></g><g><title>概念比较（本站）：比较全局可用信息与关于注意的内部模型；两者不能仅靠一项报告指标混同。</title><path d="M664 762H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="843.5" font-size="12" fill="#4b736d">R4</text></g><g><title>方法比较（本站）：由早期理论问题导航到后续理论家族检验。未做IIT版本逐项对照，不能视为对2004所有命题的直接检验。</title><path d="M664 616H986V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="992" y="843.5" font-size="12" fill="#4b736d">R5</text></g><g><title>方法比较（本站）：对照可反驳机制与预注册分歧预测；具体采用版本及辅助假设需进一步对齐。</title><path d="M664 762H1050V1071H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1056" y="916.5" font-size="12" fill="#4b736d">R6</text></g><a href="../atlas.html#e-chalmers-1995" data-node="e-chalmers-1995" aria-label="困难问题：功能解释是否穷尽体验？"><title>解释辨别、报告和注意之后，是否已经解释主观体验？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1995 · 解释对象 · E批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">困难问题：功能解释是否穷尽体验？</text></a><a href="../atlas.html#e-bechara-1997" data-node="e-bechara-1997" aria-label="身体信号与选择：先做对、后知道？"><title>显性知道之前，身体信号是否已引导有利决策？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1997 · 情感与意识测量 · E批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">身体信号与选择：先做对、后知道？</text></a><a href="../atlas.html#e-maia-mcclelland-2004" data-node="e-maia-mcclelland-2004" aria-label="知识问法改变对无意识决策的判断"><title>较宽泛提问是否低估了参与者知道多少？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">2004 · 意识测量异议 · E批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">知识问法改变对无意识决策的判断</text></a><a href="../atlas.html#e-tononi-2004" data-node="e-tononi-2004" aria-label="整合信息：区分丰富状态与整体因果作用"><title>为何大量可区分状态还不足以说明意识？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">2004 · 意识理论 · E批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">整合信息：区分丰富状态与整体因果作用</text></a><a href="../atlas.html#e-dehaene-changeux-2011" data-node="e-dehaene-changeux-2011" aria-label="全局工作空间：意识可访问性与点燃"><title>局部加工如何成为可报告、可灵活利用的信息？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2011 · 意识理论 · E批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">全局工作空间：意识可访问性与点燃</text></a><a href="../atlas.html#e-webb-graziano-2015" data-node="e-webb-graziano-2015" aria-label="注意图式：系统如何表征自己的注意"><title>大脑为何报告拥有主观觉知，以及它有什么控制用途？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2015 · 自我模型 · E批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">注意图式：系统如何表征自己的注意</text></a><a href="../atlas.html#e-cogitate-2025" data-node="e-cogitate-2025" aria-label="对抗协作：用预注册预测同时挑战两种理论"><title>共同设计的实验能否区分IIT与GNWT的若干关键预测？</title><rect x="34" y="1006" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="1031" font-size="13" fill="#5c6e62">2025 · 理论区分检验 · E批审校节点</text><text x="52" y="1064" font-size="18" fill="#203d3a">对抗协作：用预注册预测同时挑战两种理论</text></a><text x="32" y="1190" font-size="13" fill="#203d3a">实线：可定位的关系；红线：批评或回应；虚线：本站比较。引用不自动等于思想影响。</text><text x="32" y="1214" font-size="13" fill="#203d3a">没有连线表示本批尚未确认关系；不能据此判断历史上不存在联系。</text></svg>