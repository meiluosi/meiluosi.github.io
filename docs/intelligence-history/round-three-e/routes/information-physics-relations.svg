<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1086" viewBox="0 0 1100 1086" role="img" aria-label="信息、压缩、复杂系统与物理路线：分支与关系"><title>信息、压缩、复杂系统与物理路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">信息、压缩、复杂系统与物理路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>概念比较（本站）：通信不确定性与相对Y的任务相关性分开；不是同一“信息”定义自然升级。</title><path d="M664 178H730V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="332.5" font-size="12" fill="#4b736d">R1</text></g><g><title>方法比较（本站）：比较描述先验与给定Y的压缩目标，不宣称直接继承。</title><path d="M664 324H794V487H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="405.5" font-size="12" fill="#4b736d">R2</text></g><g><title>直接批评：后者挑战幂律足以支持临界性的推断；其猫记录与前者切片不同，不能称原样重复。</title><path d="M664 616H858V779H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="697.5" font-size="12" fill="#a44939">R3</text></g><g><title>概念比较（本站）：比较统计动力学与适应行为生成；两者都不直接给出通用智能定义。</title><path d="M664 616H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="770.5" font-size="12" fill="#4b736d">R4</text></g><a href="../atlas.html#e-shannon-1948" data-node="e-shannon-1948" aria-label="通信的不确定性：明确排除语义问题"><title>怎样量化消息选择并设计可靠通信？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1948 · 通信与压缩 · E批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">通信的不确定性：明确排除语义问题</text></a><a href="../atlas.html#e-solomonoff-1964" data-node="e-solomonoff-1964" aria-label="从短描述到归纳预测先验"><title>如何从有限序列为后续事件分配概率？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1964 · 归纳与压缩 · E批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">从短描述到归纳预测先验</text></a><a href="../atlas.html#e-tishby-1999" data-node="e-tishby-1999" aria-label="信息瓶颈：先指定相关变量"><title>压缩时应保留什么，而非把一切信息同等保留？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">1999 · 任务相关信息 · E批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">信息瓶颈：先指定相关变量</text></a><a href="../atlas.html#e-beggs-plenz-2003" data-node="e-beggs-plenz-2003" aria-label="神经雪崩：临界传播的候选证据"><title>局部神经活动如何兼顾传播与稳定？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">2003 · 临界性 · E批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">神经雪崩：临界传播的候选证据</text></a><a href="../atlas.html#e-touboul-destexhe-2010" data-node="e-touboul-destexhe-2010" aria-label="阈值与随机过程：幂律图形不足以定机制"><title>看似幂律的雪崩分布是否充分证明自组织临界？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2010 · 临界性异议 · E批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">阈值与随机过程：幂律图形不足以定机制</text></a><a href="../atlas.html#e-wissner-gross-2013" data-node="e-wissner-gross-2013" aria-label="因果熵力：保留未来可达路径"><title>一种统一驱动力能否生成若干适应行为？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2013 · 适应行为的物理模型 · E批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">因果熵力：保留未来可达路径</text></a><text x="32" y="1044" font-siz