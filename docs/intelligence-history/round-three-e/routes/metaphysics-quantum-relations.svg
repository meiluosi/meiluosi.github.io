<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1086" viewBox="0 0 1100 1086" role="img" aria-label="形而上学、非经典计算与量子路线：分支与关系"><title>形而上学、非经典计算与量子路线：分支与关系</title><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:hover rect,a:focus rect{stroke:#a75532;stroke-width:3}a:focus{outline:none}</style><rect width="100%" height="100%" fill="#faf9f4"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0L7,3.5L0,7" fill="context-stroke"/></marker></defs><text x="32" y="42" font-size="25" fill="#203d3a">形而上学、非经典计算与量子路线 · 分支与关系</text><text x="32" y="78" font-size="14" fill="#203d3a">卡片注明分支；纵向按年代排列，间距不表示时间。右侧R编号对应关系证据表。</text><g><title>概念比较（本站）：逻辑限制与物理机制是两层论证；前者不能单独推出特定微管机制。</title><path d="M664 178H730V341H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="736" y="259.5" font-size="12" fill="#4b736d">R1</text></g><g><title>直接批评：退相干计算针对脑内认知尺度相干假说；是否对齐原模型又受到下一节点质疑。</title><path d="M664 324H794V487H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="800" y="405.5" font-size="12" fill="#a44939">R2</text></g><g><title>直接回应：回应认为模型自由度与参数需修订，提出更长时间估计；没有完成独立生理验证。</title><path d="M664 470H858V633H668" fill="none" stroke="#a44939" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="864" y="551.5" font-size="12" fill="#a44939">R3</text></g><g><title>概念比较（本站）：具体量子物理机制与量子概率描述分开；后者明说经典脑也可能呈现相关行为结构。</title><path d="M664 324H922V925H668" fill="none" stroke="#4b736d" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="928" y="624.5" font-size="12" fill="#4b736d">R4</text></g><a href="../atlas.html#e-lucas-1961" data-node="e-lucas-1961" aria-label="哥德尔论证：从系统限制到心智超越？"><title>形式系统的不完备能否推出人类心智不是机器？</title><rect x="34" y="130" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="155" font-size="13" fill="#5c6e62">1961 · 计算与逻辑边界 · E批审校节点</text><text x="52" y="188" font-size="18" fill="#203d3a">哥德尔论证：从系统限制到心智超越？</text></a><a href="../atlas.html#e-hameroff-penrose-1996" data-node="e-hameroff-penrose-1996" aria-label="Orch OR：微管相干与客观还原假说"><title>非计算解释和体验是否需要特定量子物理过程？</title><rect x="34" y="276" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="301" font-size="13" fill="#5c6e62">1996 · 量子物理机制 · E批审校节点</text><text x="52" y="334" font-size="18" fill="#203d3a">Orch OR：微管相干与客观还原假说</text></a><a href="../atlas.html#e-tegmark-2000" data-node="e-tegmark-2000" aria-label="退相干时间：把物理主张变为数量级约束"><title>假定的脑内量子态能否保持足够久以参与认知？</title><rect x="34" y="422" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="447" font-size="13" fill="#5c6e62">2000 · 物理可行性异议 · E批审校节点</text><text x="52" y="480" font-size="18" fill="#203d3a">退相干时间：把物理主张变为数量级约束</text></a><a href="../atlas.html#e-hagan-2002" data-node="e-hagan-2002" aria-label="回应退相干批评：先对齐模型与参数"><title>Tegmark估计是否对应Orch OR的实际假设？</title><rect x="34" y="568" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="593" font-size="13" fill="#5c6e62">2002 · 物理争论回应 · E批审校节点</text><text x="52" y="626" font-size="18" fill="#203d3a">回应退相干批评：先对齐模型与参数</text></a><a href="../atlas.html#e-strawson-2006" data-node="e-strawson-2006" aria-label="真实物理主义与微观经验前提"><title>承认体验真实，又拒绝从全无体验到体验的强涌现，会得到什么？</title><rect x="34" y="714" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="739" font-size="13" fill="#5c6e62">2006 · 体验的本体论 · E批审校节点</text><text x="52" y="772" font-size="18" fill="#203d3a">真实物理主义与微观经验前提</text></a><a href="../atlas.html#e-wang-quantum-2014" data-node="e-wang-quantum-2014" aria-label="量子认知：顺序效应的概率结构"><title>提问顺序如何系统性改变判断分布？</title><rect x="34" y="860" width="630" height="112" rx="10" fill="#fff" stroke="#9bae9e"/><text x="52" y="885" font-size="13" fill="#5c6e62">2014 · 量子概率模型 · E批审校节点</text><text x="52" y="918" font-size="18" fill="#203d3a">量子认知：顺序效应的概率结构</text></a><text x