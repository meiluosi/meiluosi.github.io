"两者都可用于提问任务相关信息保留，但模型定义、目标和证明对象不同；未发现直接历史影响证据。","status":"editorial"},{"id":"r-conant-ashby-1970-brooks-1991","fromId":"e-conant-ashby-1970","toId":"e-brooks-1991","type":"editorial-comparison","evidenceSourceId":"brooks-1991","locator":"本站比较：调节事件映射与Brooks1991 §6–8","explanation":"结构上的模型关系与显式中央表征不是同一概念，表面冲突需先澄清语义。","status":"editorial"},{"id":"r-thelen-2001-wilson-2002","fromId":"e-thelen-2001","toId":"e-wilson-2002","type":"editorial-comparison","evidenceSourceId":"wilson-2002","locator":"本站比较：Thelen2001 §4.2；Wilson2002 Claim4","explanation":"将动态耦合机制与认知系统边界区分；不声称Wilson在此直接批评2001目标文。","status":"editorial"}],"baseline":{"path":"../atlas.json","sha256":"ea0b8ad24c1ae1bf7432a31afa75d2744d1f107b2c2c191e18a0f4ca714a8776","policy":"第一轮保持原状；本轮相同事件ID提供新的指定主张审校记录，不把其余候选自动升级。"},"routes":[{"id":"learning-efficiency","name":"学习效率与泛化","color":"#2563eb","question":"学会一道题，与获得可迁移的学习能力，有何不同？","narrative":["形式学习把问题变为可检验的协议：给什么经验、允许什么查询、能表示哪些概念、以什么概率和代价成功。Valiant 的原协议提醒我们，比较前先对齐这些条件。","概念生成与组合泛化提出另一层要求：新例子是否能通过已有部件重组得到？BPL让生成过程参与推断；SCAN及其后续工作把随机切分中看不出来的缺口显露出来，CFQ则尝试量化组合分布差异。","MLC说明训练任务分布可以显著改变某些组合泛化结果，但2023原文的结构外推失败和2026后续反例都限制了强解释。ARC线则追问怎样衡量技能习得效率；人类校准改善了基准设计，却仍留下外部效度问题。"],"gaps":["Fodor与Pylyshyn1988原文的完整论证仍需单独深读；本轮只通过后续研究对其论证的讨论了解争论入口。","缺少现实任务、跨文化人类测试、最新模型与长期污染控制的系统检索；没有穷尽到2026年。"]},{"id":"cybernetics-rl","name":"控制论、强化学习与主动推断","color":"#047857","question":"系统怎样维持目标、从反馈学习，并主动减少不确定性？","narrative":["Ashby关注可用调节选择的容量，Conant与Ashby讨论最简单最优调节器的映射结构。两者提供约束视角，但不是现成学习算法。模型一词也不能未经解释就等同现代神经世界模型。","TD、Q-learning和REINFORCE分别把序列预测、动作价值和随机策略变成可学习对象。保证来自各自条件；Baird的共享参数反例阻止我们把表格结果直接推广为一般函数逼近定理。","主动推断把偏好与信息获取放进策略评价；MuZero通过任务相关潜在模型支持搜索。这是不同问题设定下的分支，不能画成一个依次替代前者的阶梯。"],"gaps":["Wiener与Bellman的原始工作、赋能度分支仍需补读，第一轮入口保留。","未执行原论文训练或SPM模拟；尚未系统比较主动推断与信念状态RL的等价条件及差异。"]},{"id":"embodied-dynamical","name":"具身、生态与动力系统","color":"#b45309","question":"智能行为应在大脑、身体与环境的哪一层解释？","narrative":["Gibson从动物—环境关系界定供给性，Brooks从可运行的行为层构造机器人。前者是知觉理论，后者是架构与工程方法，两者不因都谈环境就成为同一种机制。","McGeer展示机械结构可贡献步态；Thelen等把行动历史引入婴儿错误模型。行为成功、动态描述、认知解释与神经实现需要不同证据，姿态实验的注意混杂也必须保留。","Wilson拆分具身认知命题，形态计算研究尝试量化身体与控制器的贡献。2013与2015指标的差异说明，系统边界、协同信息和因果性仍是核心问题。"],"gaps":["Varela1991、Thelen与Smith1994专著及Beer动力系统框架未在本轮完成；行动生成论分支仍是明确缺口。","未开展机器人或婴儿实验复现；二元信息算例只能检查指标含义，不能替代真实身体证据。"]}],"svg":{"learning-efficiency":{"timeline":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"854\" viewBox=\"0 0 1400 854\" role=\"img\" aria-label=\"学习效率与泛化：等比例时间线\">\u003ctitle>学习效率与泛化：等比例时间线\u003c/title>\u003cstyle>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}a:focus rect,a:focus circle{stroke:#db2777;stroke-width:4}a:hover text{fill:#1d4ed8}\u003c/style>\u003crect width=\"100%\" height=\"100%\" fill=\"#fcfbf7\"/>\u003ctext x=\"36\" y=\"40\" font-size=\"25\" fill=\"#172033\">学习效率与泛化\u003c/text>\u003ctext x=\"36\" y=\"74\" font-size=\"15\" fill=\"#172033\">年份使用共同等比例坐标；纵向分行用于阅读，不表示因果。\u003c/text>\u003cpath d=\"M650 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"650\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">1950\u003c/text>\u003cpath d=\"M733.75 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"733.75\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">1960\u003c/text>\u003cpath d=\"M817.5 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"817.5\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">1970\u003c/text>\u003cpath d=\"M901.25 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"901.25\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">1980\u003c/text>\u003cpath d=\"M985 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"985\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">1990\u003c/text>\u003cpath d=\"M1068.75 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"1068.75\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">2000\u003c/text>\u003cpath d=\"M1152.5 110V814\" stroke=\"#dce2e7\"/>\u003ctext x=\"1152.5\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" fill=\"#576273\">2010\u003c/text>\
