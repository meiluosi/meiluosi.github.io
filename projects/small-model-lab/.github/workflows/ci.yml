name: Tiny pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Check invariants
        run: python -m unittest discover -s tests -v
      - name: Exercise entire pipeline
        run: python scripts/lab.py smoke --output runs/ci-smoke --device cpu
      - name: Retain text reports, never weights
        uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-reports
          path: |
            runs/ci-smoke/summary.json
            runs/ci-smoke/*/report.json
            runs/ci-smoke/*/evaluation.json
