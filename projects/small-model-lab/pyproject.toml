[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-lab"
version = "0.1.0"
description = "A measured, from-scratch decoder training laboratory"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = ["torch>=2.6,<3", "tokenizers>=0.21,<1"]

[project.scripts]
small-model-lab = "small_model_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
