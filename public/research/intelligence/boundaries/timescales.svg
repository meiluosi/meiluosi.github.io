<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="历史、状态与在线反馈"><title>历史、状态与在线反馈</title><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#253c37}.minor{fill:#62726b}</style><rect width="100%" height="100%" fill="#faf8f1"/><text x="28" y="44" font-size="27" class="">时间尺度与介入位置</text><text x="28" y="78" font-size="16" class="minor">示意对应本站有限模型，不是儿童发展或生命机制的经验模型。</text><rect x="28" y="116" width="320" height="145" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="46" y="152" font-size="21" class="">过去的四步输入</text><text x="46" y="188" font-size="17" class="">e序列：0000 / 1111</text><text x="46" y="224" font-size="17" class="">1100 / 0011</text><text x="350" y="196" font-size="22" class="">→</text><rect x="372" y="116" width="320" height="145" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="390" y="152" font-size="21" class="">测试前的状态 h</text><text x="390" y="188" font-size="17" class="">历史通过状态留下影响</text><text x="390" y="224" font-size="17" class="">可介入：把 h 重置为0</text><text x="694" y="196" font-size="22" class="">→</text><rect x="716" y="116" width="320" height="145" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="734" y="152" font-size="21" class="">测试的当前支持 u</text><text x="734" y="188" font-size="17" class="">学习冻结，读数 y=h+u</text><text x="734" y="224" font-size="17" class="">可介入：当前支持0或1</text><rect x="28" y="305" width="1020" height="118" rx="12" fill="#eff3e9" stroke="#c5d0bf"/><text x="48" y="342" font-size="20" class="">反馈模型：闭环环境读取当前 x；回放环境只读取预先记录的轨迹。</text><text x="48" y="379" font-size="18" class="">基线相同；t=2扰动后，e在t=3分开，x到t=4才分开。</text><text x="28" y="467" font-size="17" class="">两类核验都只约束因果推论，不能直接判定认知构成。</text></svg>
