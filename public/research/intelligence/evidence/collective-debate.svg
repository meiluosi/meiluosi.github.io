<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-label="群体共同因素的争论与版本"><title>群体共同因素的争论与版本</title><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203d3a}.small{fill:#57675f}</style><defs><marker id="debate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#577c6c"/></marker></defs><rect width="100%" height="100%" fill="#faf9f4"/><text x="32" y="42" font-size="25">群体共同因素：什么延续，什么发生争论？</text><text x="32" y="76" font-size="15">按争论阅读顺序组织；横向距离不表示年数。</text><a href="/research/intelligence/sources/woolley-2010/"><rect x="24" y="122" width="244" height="210" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="44" y="155" font-size="16">2010 · Woolley等</text><text x="40" y="194" font-size="14">多任务共同因素与预测</text><text x="40" y="218" font-size="14">轮次数据仅46组</text><text x="40" y="242" font-size="14">原文＋补充材料</text></a><path d="M268 224H284" stroke="#577c6c" marker-end="url(#debate-arrow)"/><a href="/research/intelligence/sources/bates-gupta-2017/"><rect x="288" y="122" width="244" height="210" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="308" y="155" font-size="16">2017 · Bates与Gupta</text><text x="304" y="194" font-size="14">个体能力解释的挑战</text><text x="304" y="218" font-size="14">任务／计分／记录有差别</text><text x="304" y="242" font-size="14">2016作者接受稿</text></a><path d="M532 224H548" stroke="#577c6c" marker-end="url(#debate-arrow)"/><a href="/research/intelligence/sources/riedl-2021/"><rect x="552" y="122" width="244" height="210" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="572" y="155" font-size="16">2021 · Riedl等</text><text x="568" y="194" font-size="14">22样本，1356组</text><text x="568" y="218" font-size="14">留出一种任务作预测</text><text x="568" y="242" font-size="14">未等同新群体外部验证</text></a><path d="M796 224H812" stroke="#577c6c" marker-end="url(#debate-arrow)"/><a href="/research/intelligence/sources/riedl-correction-2022/"><rect x="816" y="122" width="244" height="210" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="836" y="155" font-size="16">2022 · 正式更正</text><text x="832" y="194" font-size="14">AVE：44% → 19.6%</text><text x="832" y="218" font-size="14">三指标模型零自由度</text><text x="832" y="242" font-size="14">更正不自动裁决所有结论</text></a><text x="32" y="382" font-size="16">共识范围：所测任务中的共同表现结构。争点：构念、预测来源、任务依赖与因果解释。</text><text x="32" y="408" font-size="16">更正应覆盖旧报告值；平均提取方差与第一特征值所占总方差不能直接比较。</text></svg>
