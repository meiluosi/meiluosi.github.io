<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-label="从证据到结论需要哪些条件"><title>从证据到结论需要哪些条件</title><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203d3a}.small{fill:#57675f}</style><defs><marker id="inference-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#577c6c"/></marker></defs><rect width="100%" height="100%" fill="#faf9f4"/><text x="32" y="42" font-size="26">从证据到结论，需要哪些条件？</text><text x="32" y="76" font-size="15">这些是不同解释任务，纵向排布不表示证据等级。</text><a href="/research/intelligence/evidence/#p1"><rect x="32" y="112" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="52" y="145" font-size="16">任务表现</text><text x="52" y="171" font-size="16">成绩、时间、错误模式</text><rect x="32" y="263" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="52" y="296" font-size="16">任务／评分／资源对齐</text><text x="52" y="322" font-size="16">留出任务与对象验证</text><rect x="32" y="414" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="52" y="447" font-size="16">有适用域的能力判断</text><text x="52" y="473" font-size="16">不能直接识别算法</text></a><path d="M192 207V256M192 358V407" stroke="#577c6c" stroke-width="2" marker-end="url(#inference-arrow)"/><a href="/research/intelligence/evidence/#p2"><rect x="380" y="112" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="400" y="145" font-size="16">共同变化</text><text x="400" y="171" font-size="16">相关结构、潜在因子</text><rect x="380" y="263" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="400" y="296" font-size="16">测量与竞争模型审计</text><text x="400" y="322" font-size="16">检查是否观察等价</text><rect x="380" y="414" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="400" y="447" font-size="16">统计结构与预测约束</text><text x="400" y="473" font-size="16">不能唯一识别共同原因</text></a><path d="M540 207V256M540 358V407" stroke="#577c6c" stroke-width="2" marker-end="url(#inference-arrow)"/><a href="/research/intelligence/evidence/#p3"><rect x="728" y="112" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="748" y="145" font-size="16">干预与损伤</text><text x="748" y="171" font-size="16">改变结构后表现变化</text><rect x="728" y="263" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="748" y="296" font-size="16">操纵特异性与过程读数</text><text x="748" y="322" font-size="16">新情境与恢复检验</text><rect x="728" y="414" width="320" height="95" rx="12" fill="#eff3ec" stroke="#bdcbbf"/><text x="748" y="447" font-size="16">受检条件中的因果约束</text><text x="748" y="473" font-size="16">仍需解释计算组织</text></a><path d="M888 207V256M888 358V407" stroke="#577c6c" stroke-width="2" marker-end="url(#inference-arrow)"/><text x="32" y="556" font-size="16">综合：保留条件、竞争解释与下一项可区分检验。意义／体验的桥接前提另行论证。</text></svg>
