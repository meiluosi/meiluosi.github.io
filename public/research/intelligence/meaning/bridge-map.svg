<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" role="img" aria-label="五种需要论证的桥接；不是自动推导"><title>五种需要论证的桥接；不是自动推导</title><rect width="1100" height="920" fill="#f4f3e9"/><g font-family="system-ui, -apple-system, PingFang SC, sans-serif"><text x="35" y="48" font-size="27" fill="#243b35"><tspan x="35" dy="0">先对齐解释目标，再说明桥接条件</tspan></text><text x="35" y="82" font-size="16" fill="#5c6a61"><tspan x="35" dy="0">箭头表示待论证的连接；类型和限制须与结论一起阅读。</tspan></text><rect x="30" y="112" width="1040" height="137" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="142" font-size="14" fill="#8a552c"><tspan x="52" dy="0">经验识别条件</tspan></text><text x="52" y="179" font-size="23" fill="#243b35"><tspan x="52" dy="0">可用的语言表现 → 指称／交际意义</tspan></text><text x="52" y="211" font-size="16" fill="#243b35"><tspan x="52" dy="0">训练与交互是否约束对象和意图？</tspan></text><text x="52" y="236" font-size="15" fill="#677168"><tspan x="52" dy="0">须防止：形式分布相同可对应不同映射</tspan></text><rect x="30" y="267" width="1040" height="137" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="297" font-size="14" fill="#8a552c"><tspan x="52" dy="0">语义理论＋经验检验</tspan></text><text x="52" y="334" font-size="23" fill="#243b35"><tspan x="52" dy="0">内部表征与推理 → 概念角色意义</tspan></text><text x="52" y="366" font-size="16" fill="#243b35"><tspan x="52" dy="0">角色论是否适用，关系是否有稳定因果作用？</tspan></text><text x="52" y="391" font-size="15" fill="#677168"><tspan x="52" dy="0">须防止：探针相关或流畅回答不足以证成角色</tspan></text><rect x="30" y="422" width="1040" height="137" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="452" font-size="14" fill="#8a552c"><tspan x="52" dy="0">操作定义＋测量假说</tspan></text><text x="52" y="489" font-size="23" fill="#243b35"><tspan x="52" dy="0">可用信息与实际报告 → 意识访问</tspan></text><text x="52" y="521" font-size="16" fill="#243b35"><tspan x="52" dy="0">报告要求、注意和记忆怎样影响指标？</tspan></text><text x="52" y="546" font-size="15" fill="#677168"><tspan x="52" dy="0">须防止：可报告不等于每次实际报告</tspan></text><rect x="30" y="577" width="1040" height="137" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="607" font-size="14" fill="#8a552c"><tspan x="52" dy="0">解释主张＋生物实现假说</tspan></text><text x="52" y="644" font-size="23" fill="#243b35"><tspan x="52" dy="0">神经机制与因果结构 → 现象体验</tspan></text><text x="52" y="676" font-size="16" fill="#243b35"><tspan x="52" dy="0">全局可用、同一主张或心理物理原则？</tspan></text><text x="52" y="701" font-size="15" fill="#677168"><tspan x="52" dy="0">须防止：数学量、代理信号和体验不能互换</tspan></text><rect x="30" y="732" width="1040" height="137" rx="14" fill="#fffdf7" stroke="#ccd4c7"/><text x="52" y="762" font-size="14" fill="#8a552c"><tspan x="52" dy="0">经验推断</tspan></text><text x="52" y="799" font-size="23" fill="#243b35"><tspan x="52" dy="0">预先约定的神经预测 → 理论的支持或挑战</tspan></text><text x="52" y="831" font-size="16" fill="#243b35"><tspan x="52" dy="0">版本、辅助条件、有效测量和分析身份？</tspan></text><text x="52" y="856" font-size="15" fill="#677168"><tspan x="52" dy="0">须防止：失败预测不等于全部理论的总裁决</tspan></text></g></svg>
