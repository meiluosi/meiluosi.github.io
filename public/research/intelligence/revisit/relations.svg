<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">缺口补读与反方</title><desc id="desc">六个研究节点及其问题。虚线代表编辑比较，年份顺序不等同历史影响。</desc><rect width="1100" height="720" fill="#f3f6f1"/><g font-family="system-ui,sans-serif" fill="#263f37"><text x="35" y="45" font-size="25">关键缺口：从定义到资源条件</text><rect x="30" y="75" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="106" font-size="20">2007 · 智能是否只有一种定义？</text><text x="50" y="137" font-size="15">不同研究者所说的智能究竟包括哪些能力或目标？</text><rect x="30" y="175" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="206" font-size="20">1982 · 解释计算的三个层次</text><text x="50" y="237" font-size="15">只知道物理实现，能否完整理解视觉中的信息处理？</text><rect x="30" y="275" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="306" font-size="20">2017 · 用注意力构造序列变换</text><text x="50" y="337" font-size="15">序列建模如何减少循环造成的训练串行依赖？</text><rect x="30" y="375" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="406" font-size="20">2020 · 规模规律预测什么？</text><text x="50" y="437" font-size="15">模型、数据与计算预算如何影响语言模型的交叉熵损失？</text><rect x="30" y="475" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="506" font-size="20">2022 · 同一训练预算，模型和数据如何配比？</text><text x="50" y="537" font-size="15">对固定训练FLOPs，应怎样配置模型大小和训练token数量？</text><rect x="30" y="575" width="1040" height="82" rx="12" fill="#fff" stroke="#bac9bb"/><text x="50" y="606" font-size="20">2024 · 为什么两条规模规律的指数不同？</text><text x="50" y="637" font-size="15">Kaplan与Chinchilla的最优规模指数分歧可能来自什么？</text><text x="35" y="700" font-size="14">关系类型、原文定位及反方见对应节点和关系台账。</text></g></svg>
