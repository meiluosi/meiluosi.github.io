<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc"><title id="title">生命、自维持与演化路线：已审校节点时间线</title><desc id="desc">横轴为原记录中的年份，点按节点打开问题和证据；纵向只用于排版，不表示历史影响。年代未定文本列在页面独立区域。</desc><rect width="1200" height="485" fill="#f3f6f1"/><g font-family="system-ui,sans-serif" fill="#263f37"><text x="30" y="42" font-size="24">生命、自维持与演化路线</text><text x="30" y="75" font-size="15">横轴：记录年份；行距为排版，不表示影响或强弱</text><line x1="340" x2="340" y1="105" y2="461" stroke="#d6dfd5"/><text x="340" y="99" text-anchor="middle" font-size="15">1850</text><line x1="566" x2="566" y1="105" y2="461" stroke="#d6dfd5"/><text x="566" y="99" text-anchor="middle" font-size="15">1900</text><line x1="793" x2="793" y1="105" y2="461" stroke="#d6dfd5"/><text x="793" y="99" text-anchor="middle" font-size="15">1950</text><line x1="1019" x2="1019" y1="105" y2="461" stroke="#d6dfd5"/><text x="1019" y="99" text-anchor="middle" font-size="15">2000</text><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-darwin-1859"><title>1859 · 适应如何通过世代变化形成？；问题：复杂的适应结构一定需要预定目的或设计吗？；方法：将变异、保存与淘汰放入生存条件和种间关系的历史过程。；限制：演化适应不等于个体学习或智慧，适应性故事也不能替代独立历史证据。</title><text x="30" y="140" font-size="16">1. 适应如何通过世代变化形成？</text><circle cx="381" cy="134" r="8" fill="#557d64"/><circle cx="381" cy="134" r="22" fill="transparent" pointer-events="all"/><text x="395" y="140" font-size="14">1859</text></a><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-varela-maturana-uribe-1974"><title>1974（实读1981再版转录） · 生命单位怎样持续产生自身？；问题：繁殖是否足以定义一个正在活着的单位？；方法：将产生组分的网络及其生成边界相互闭合，区分组织关系与具体组分。；限制：模拟满足指定组织条件不等于具备认知或生命全部现象；未重跑原附录算法。</title><text x="30" y="195" font-size="16">2. 生命单位怎样持续产生自身？</text><circle cx="902" cy="189" r="8" fill="#557d64"/><circle cx="902" cy="189" r="22" fill="transparent" pointer-events="all"/><text x="916" y="195" font-size="14">1974</text></a><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-weber-varela-2002"><title>2002 · 生命的自维持如何带来意义？；问题：有机体的目的能否由其自身组织解释？；方法：把自我生产和脆弱的生命个体性连接到内在目的与环境意义。；限制：“存活对自身有意义”到“能调节并区分好坏”仍有额外论证负担。</title><text x="30" y="250" font-size="16">3. 生命的自维持如何带来意义？</text><circle cx="1028" cy="244" r="8" fill="#557d64"/><circle cx="1028" cy="244" r="22" fill="transparent" pointer-events="all"/><text x="1042" y="250" font-size="14">2002</text></a><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-dipaolo-2005"><title>2005 · 稳健存活与主动适应有何不同？；问题：同样活着的不同状态，系统怎样辨别其趋势？；方法：在自创生之外引入适应性：监测并调节状态朝向或远离可生存边界的趋势。；限制：可生存域是理论条件；具体生物的边界、感知及调节仍需测量。</title><text x="30" y="305" font-size="16">4. 稳健存活与主动适应有何不同？</text><circle cx="1042" cy="299" r="8" fill="#557d64"/><circle cx="1042" cy="299" r="22" fill="transparent" pointer-events="all"/><text x="1056" y="305" font-size="14">2005</text></a><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-boisseau-2016"><title>2016 · 没有神经元也能出现习惯化吗？；问题：反应减弱是学习，还是疲劳／感受适应？；方法：重复让黏菌跨含奎宁或咖啡因的桥，以换刺激和移除刺激后的恢复作对照。；限制：支持特定非联想学习判据，不证明理解、意识或任意认知；作者承认化学感受机制未知。</title><text x="30" y="360" font-size="16">5. 没有神经元也能出现习惯化吗？</text><circle cx="1092" cy="354" r="8" fill="#557d64"/><circle cx="1092" cy="354" r="22" fill="transparent" pointer-events="all"/><text x="1106" y="360" font-size="14">2016</text></a><a href="/research/intelligence/timelines/autopoiesis-evolution/#e-levin-2019"><title>2019 · 主体能否跨多个生物尺度？；问题：细胞、组织和整体的目标如何形成更大主体？；方法：以系统可测量、建模和影响的时空范围刻画认知边界，提出由稳态驱动扩展的假说。；限制：框架不证明每个尺度均具主观体验；同文中佛教类比不构成跨文化原典证据。</title><text x="30" y="415" font-size="16">6. 主体能否跨多个生物尺度？</text><circle cx="1105" cy="409" r="8" fill="#557d64"/><circle cx="1105" cy="409" r="22" fill="transparent" pointer-events="all"/><text x="1119" y="415" font-size="14">2019</text></a></g></svg>
