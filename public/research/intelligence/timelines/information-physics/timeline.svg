<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc"><title id="title">信息、压缩、复杂系统与物理路线：已审校节点时间线</title><desc id="desc">横轴为原记录中的年份，点按节点打开问题和证据；纵向只用于排版，不表示历史影响。年代未定文本列在页面独立区域。</desc><rect width="1200" height="485" fill="#f3f6f1"/><g font-family="system-ui,sans-serif" fill="#263f37"><text x="30" y="42" font-size="24">信息、压缩、复杂系统与物理路线</text><text x="30" y="75" font-size="15">横轴：记录年份；行距为排版，不表示影响或强弱</text><line x1="340" x2="340" y1="105" y2="461" stroke="#d6dfd5"/><text x="340" y="99" text-anchor="middle" font-size="15">1900</text><line x1="661" x2="661" y1="105" y2="461" stroke="#d6dfd5"/><text x="661" y="99" text-anchor="middle" font-size="15">1950</text><line x1="982" x2="982" y1="105" y2="461" stroke="#d6dfd5"/><text x="982" y="99" text-anchor="middle" font-size="15">2000</text><a href="/research/intelligence/timelines/information-physics/#e-shannon-1948"><title>1948 · 通信的不确定性：明确排除语义问题；问题：怎样量化消息选择并设计可靠通信？；方法：用概率分布、对数单位与熵刻画不确定性。；限制：高熵不自动表示理解；论文没有给出通用智能量表。</title><text x="30" y="140" font-size="16">1. 通信的不确定性：明确排除语义问题</text><circle cx="648" cy="134" r="8" fill="#557d64"/><circle cx="648" cy="134" r="22" fill="transparent" pointer-events="all"/><text x="662" y="140" font-size="14">1948</text></a><a href="/research/intelligence/timelines/information-physics/#e-solomonoff-1964"><title>1964 · 从短描述到归纳预测先验；问题：如何从有限序列为后续事件分配概率？；方法：用描述或生成序列的程序来组织归纳模型。；限制：本批不把后来严格证明倒填进1964；未提供本站可运行的通用归纳器。</title><text x="30" y="195" font-size="16">2. 从短描述到归纳预测先验</text><circle cx="751" cy="189" r="8" fill="#557d64"/><circle cx="751" cy="189" r="22" fill="transparent" pointer-events="all"/><text x="765" y="195" font-size="14">1964</text></a><a href="/research/intelligence/timelines/information-physics/#e-tishby-1999"><title>1999 · 信息瓶颈：先指定相关变量；问题：压缩时应保留什么，而非把一切信息同等保留？；方法：压缩X到T，同时保留T关于Y的互信息；目标I(T;X)-βI(T;Y)。；限制：这里的“meaningful”指相对Y的相关信息，不直接等于哲学语义或意识。</title><text x="30" y="250" font-size="16">3. 信息瓶颈：先指定相关变量</text><circle cx="975" cy="244" r="8" fill="#557d64"/><circle cx="975" cy="244" r="22" fill="transparent" pointer-events="all"/><text x="989" y="250" font-size="14">1999</text></a><a href="/research/intelligence/timelines/information-physics/#e-beggs-plenz-2003"><title>2003 · 神经雪崩：临界传播的候选证据；问题：局部神经活动如何兼顾传播与稳定？；方法：比较皮层局部场电位雪崩大小与临界分枝模型，并用简化网络模拟信息传播。；限制：原文实验未独立复现；幂律与临界机制的对应需竞争模型和统计检验。</title><text x="30" y="305" font-size="16">4. 神经雪崩：临界传播的候选证据</text><circle cx="1001" cy="299" r="8" fill="#557d64"/><circle cx="1001" cy="299" r="22" fill="transparent" pointer-events="all"/><text x="1015" y="305" font-size="14">2003</text></a><a href="/research/intelligence/timelines/information-physics/#e-touboul-destexhe-2010"><title>2010 · 阈值与随机过程：幂律图形不足以定机制；问题：看似幂律的雪崩分布是否充分证明自组织临界？；方法：将清醒猫记录、打乱／正峰控制、阈值随机过程和临界网络对照比较。；限制：限制的是一类证据推断；不能用此文一笔否定所有神经临界性研究。</title><text x="30" y="360" font-size="16">5. 阈值与随机过程：幂律图形不足以定</text><circle cx="1046" cy="354" r="8" fill="#557d64"/><circle cx="1046" cy="354" r="22" fill="transparent" pointer-events="all"/><text x="1060" y="360" font-size="14">2010</text></a><a href="/research/intelligence/timelines/information-physics/#e-wissner-gross-2013"><title>2013 · 因果熵力：保留未来可达路径；问题：一种统一驱动力能否生成若干适应行为？；方法：在简化机械系统中以未来可达路径多样性驱动运动。；限制：简化圆盘完成构造任务不直接等于动物的认知机制；未来路径估计和计算成本仍需计入。</title><text x="30" y="415" font-size="16">6. 因果熵力：保留未来可达路径</text><circle cx="1065" cy="409" r="8" fill="#557d64"/><circle cx="1065" cy="409" r="22" fill="transparent" pointer-events="all"/><text x="1079" y="415" font-size="14">2013</text></a></g></svg>
