<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">社会文化与语言路线：已审校节点时间线</title><desc id="desc">横轴为原记录中的年份，点按节点打开问题和证据；纵向只用于排版，不表示历史影响。年代未定文本列在页面独立区域。</desc><rect width="1200" height="540" fill="#f3f6f1"/><g font-family="system-ui,sans-serif" fill="#263f37"><text x="30" y="42" font-size="24">社会文化与语言路线</text><text x="30" y="75" font-size="15">横轴：记录年份；行距为排版，不表示影响或强弱</text><line x1="340" x2="340" y1="105" y2="516" stroke="#d6dfd5"/><text x="340" y="99" text-anchor="middle" font-size="15">1900</text><line x1="661" x2="661" y1="105" y2="516" stroke="#d6dfd5"/><text x="661" y="99" text-anchor="middle" font-size="15">1950</text><line x1="982" x2="982" y1="105" y2="516" stroke="#d6dfd5"/><text x="982" y="99" text-anchor="middle" font-size="15">2000</text><a href="/research/intelligence/timelines/sociocultural-language/#e-vygotsky-1934"><title>1934 · 词义成为发展的分析单位；问题：如何研究思想与言语的内部关系？；方法：以词义作为兼具言语和思维特征的分析单位，追踪意义的变化。；限制：不是“所有思维都必须有语言”的证明；网页译本及原实验未完整核查。</title><text x="30" y="140" font-size="16">1. 词义成为发展的分析单位</text><circle cx="558" cy="134" r="8" fill="#557d64"/><circle cx="558" cy="134" r="22" fill="transparent" pointer-events="all"/><text x="572" y="140" font-size="14">1934</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-henrich-2004"><title>2004 · 文化技能的保存需要学习网络；问题：个体善于择优学习，为何群体仍可能丢失复杂技能？；方法：结合偏向高技能示范者的学习与带噪、平均有损的传递，分析有效学习池。；限制：模型机制不等于特定社会的史实已证实，不据技术类别推断群体内在能力。</title><text x="30" y="195" font-size="16">2. 文化技能的保存需要学习网络</text><circle cx="1007" cy="189" r="8" fill="#557d64"/><circle cx="1007" cy="189" r="22" fill="transparent" pointer-events="all"/><text x="1021" y="195" font-size="14">2004</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-senghas-2004"><title>2004 · 新生手语的代际结构变化；问题：儿童只是复制输入，还是重组表达结构？；方法：比较三个接触年代队列对运动方式与路径的表达，并与有声语言伴随手势比较。；限制：不能用小样本队列差异独立裁决全部先天／后天争论。</title><text x="30" y="250" font-size="16">3. 新生手语的代际结构变化</text><circle cx="1007" cy="244" r="8" fill="#557d64"/><circle cx="1007" cy="244" r="22" fill="transparent" pointer-events="all"/><text x="1021" y="250" font-size="14">2004</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-tomasello-2005"><title>2005 · 共同目标与分享动机；问题：理解他人目标为何还不够解释人类文化协作？；方法：把意图理解与分享心理状态的动机结合，提出共同目标和对话式表征。；限制：人类独有是作者当时假说，本批不把它当全部物种比较已定论。</title><text x="30" y="305" font-size="16">4. 共同目标与分享动机</text><circle cx="1014" cy="299" r="8" fill="#557d64"/><circle cx="1014" cy="299" r="22" fill="transparent" pointer-events="all"/><text x="1028" y="305" font-size="14">2005</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-derex-2013"><title>2013 · 把文化累积转成群体实验；问题：群体规模能否影响技能保留与改进？；方法：摘要报告采用双任务电脑游戏比较不同规模群体的文化表现。；限制：本批仅核对摘要，不自行补写原文实验细节；后续评论对解释提出异议。</title><text x="30" y="360" font-size="16">5. 把文化累积转成群体实验</text><circle cx="1065" cy="354" r="8" fill="#557d64"/><circle cx="1065" cy="354" r="22" fill="transparent" pointer-events="all"/><text x="1079" y="360" font-size="14">2013</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-andersson-read-2014"><title>2014 · 同一数据如何支持相反解释；问题：“规模效应”究竟指群体保存，还是个体学习改善？；方法：评论使用抽样零模型；回复质疑独立性和概率估计，并区分群体与个体层级。；限制：本批不裁决哪方统计正确；“趋势未显著”不能写成证明无效。</title><text x="30" y="415" font-size="16">6. 同一数据如何支持相反解释</text><circle cx="1072" cy="409" r="8" fill="#557d64"/><circle cx="1072" cy="409" r="22" fill="transparent" pointer-events="all"/><text x="1086" y="415" font-size="14">2014</text></a><a href="/research/intelligence/timelines/sociocultural-language/#e-mesoudi-2018"><title>2018 · 为累积文化分解判据；问题：不同研究是否在测量同一种“累积”？；方法：分开行为变化、社会传递、表现改善及反复累积，并另列更强扩展条件。；限制：这是建议性概念框架，不能代替各物种的原始行为证据。</title><text x="30" y="470" font-size="16">7. 为累积文化分解判据</text><circle cx="1097" cy="464" r="8" fill="#557d64"/><circle cx="1097" cy="464" r="22" fill="transparent" pointer-events="all"/><text x="1111" y="470" font-size="14">2018</text></a></g></svg>
