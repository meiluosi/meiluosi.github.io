<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">智慧、价值与跨文化路线：已审校节点时间线</title><desc id="desc">横轴为原记录中的年份，点按节点打开问题和证据；纵向只用于排版，不表示历史影响。年代未定文本列在页面独立区域。</desc><rect width="1200" height="320" fill="#f3f6f1"/><g font-family="system-ui,sans-serif" fill="#263f37"><text x="30" y="42" font-size="24">智慧、价值与跨文化路线</text><text x="30" y="75" font-size="15">横轴：记录年份；行距为排版，不表示影响或强弱</text><line x1="340" x2="340" y1="105" y2="296" stroke="#d6dfd5"/><text x="340" y="99" text-anchor="middle" font-size="15">1950</text><line x1="890" x2="890" y1="105" y2="296" stroke="#d6dfd5"/><text x="890" y="99" text-anchor="middle" font-size="15">2000</text><a href="/research/intelligence/timelines/wisdom-values/#e-sternberg-1998"><title>1998 · 智慧把能力指向共同善；问题：追求个人成功的能力如何与智慧区别？；方法：以价值调节默会知识，在个人、人际、超个人利益及适应、塑造、选择环境间平衡。；限制：正文未读；当前作者网站的新表述不能倒记成1998原句。</title><text x="30" y="140" font-size="16">1. 智慧把能力指向共同善</text><circle cx="868" cy="134" r="8" fill="#557d64"/><circle cx="868" cy="134" r="22" fill="transparent" pointer-events="all"/><text x="882" y="140" font-size="14">1998</text></a><a href="/research/intelligence/timelines/wisdom-values/#e-baltes-staudinger-2000"><title>2000 · 把生活判断转成评分协议；问题：如何观察智慧相关知识而不只依赖声望？；方法：以生活困境的出声思考记录，按事实知识、程序知识、生命周期情境、价值相对性、不确定性评分。；限制：评分可靠不自动保证跨文化构念等价或规范正确。</title><text x="30" y="195" font-size="16">2. 把生活判断转成评分协议</text><circle cx="890" cy="189" r="8" fill="#557d64"/><circle cx="890" cy="189" r="22" fill="transparent" pointer-events="all"/><text x="904" y="195" font-size="14">2000</text></a><a href="/research/intelligence/timelines/wisdom-values/#e-grossmann-2012"><title>2012 · 智慧表现中的年龄与文化；问题：智慧是否随年龄按同一路径增长？；方法：比较东京与美国密歇根样本对人际和群际冲突的推理，进行六维编码。；限制：横断面不等于同一个人随年龄变化；不能据样本差异概括所有文化成员。</title><text x="30" y="250" font-size="16">3. 智慧表现中的年龄与文化</text><circle cx="1022" cy="244" r="8" fill="#557d64"/><circle cx="1022" cy="244" r="22" fill="transparent" pointer-events="all"/><text x="1036" y="250" font-size="14">2012</text></a></g></svg>
